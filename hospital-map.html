<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Инфекционная больница — навигация</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== ШАПКА ===== */
        .header {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            gap: 8px;
            z-index: 20;
        }

        .header-left {
            flex: 1;
            min-width: 160px;
        }

        .hospital-name {
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 800;
            color: #dc0c0c;
        }

        .subtitle {
            font-size: clamp(11px, 3vw, 13px);
            color: #1565C0;
            font-weight: 500;
            margin-top: 2px;
        }

        .btn-fullscreen {
            background: #1565C0;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 30px;
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-fullscreen:active { transform: scale(0.96); }

        /* ===== КАРТА ===== */
        .map-area {
            position: relative;
            overflow-x: auto;
            overflow-y: hidden;
            background: #1a1a2e;
            flex: 1;
            min-height: 0;
        }

        .map-wrapper {
            position: relative;
            height: 100%;
            display: inline-block;
        }

        #map-image {
            display: block;
            height: 100%;
            width: auto;
            pointer-events: none;
        }

        /* Маркеры */
        .marker {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #5D4037;
            background: #D7CCC8;
            border: 2px solid #8D6E63;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
        }
        .marker.target {
            box-shadow: 0 0 0 4px rgba(21,101,192,0.55);
            border-color: #1565C0;
        }
        .marker-start {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #2E7D32;
            border: 3px solid white;
            font-size: 17px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46,125,50,0.7); }
            70% { box-shadow: 0 0 0 15px rgba(46,125,50,0); }
            100% { box-shadow: 0 0 0 0 rgba(46,125,50,0); }
        }
        .marker-callout {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(21,101,192,0.45);
            border: 1.5px solid rgba(21,101,192,0.7);
        }

        #route-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* ===== ПАНЕЛЬ КОРПУСОВ (выезжает) ===== */
        .buildings-panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            transition: height 0.3s ease;
            overflow: hidden;
        }

        .panel-header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            color: #1a1a2e;
            border-bottom: 1px solid #ccc;
            flex-shrink: 0;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .panel-arrow {
            font-size: 20px;
            transition: transform 0.2s;
        }
        .panel-arrow.open {
            transform: rotate(180deg);
        }

        .buildings-list {
            height: 0;
            overflow-y: auto;
            transition: height 0.3s ease;
        }

        .buildings-panel.open .buildings-list {
            height: calc(100% - 50px);
        }

        .building-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 20px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
        }
        .building-item:active { background: #E3F2FD; }
        .building-num {
            width: 32px;
            height: 32px;
            background: #EEEEEE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            color: #37474F;
        }
        .building-info {
            flex: 1;
        }
        .building-name {
            font-weight: 600;
            font-size: 15px;
            color: #263238;
        }
        .building-depts {
            font-size: 11px;
            color: #90A4AE;
        }

        /* ===== ПАНЕЛЬ ПОДСКАЗКИ ===== */
        .hint-panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        .hint-text {
            padding: 10px 20px;
            font-size: 13px;
            color: #546E7A;
            background: #F8F9FA;
            display: flex;
            align-items: center;
            height: 100%;
        }

        .route-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: white;
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 30;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .route-info {
            font-size: 13px;
            font-weight: 500;
        }
        .distance-badge {
            background: #42A5F5;
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
        }
        .btn-reset {
            background: #EF5350;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .hidden { display: none !important; }
        
        /* Анимация для эмодзи */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }

        .hint-text .emoji {
            display: inline-block;
            animation: bounce 1.3s ease-in-out infinite;
            margin-right: 6px;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="hospital-name">Инфекционная больница</div>
        <div class="subtitle">Навигационная карта</div>
    </div>
    <button class="btn-fullscreen" id="openFullscreenBtn">🗺 Открыть карту</button>
</div>

<div class="map-area" id="mapArea">
    <div class="map-wrapper" id="mapWrapper">
        <img id="map-image" src="hospital-map.png" alt="Карта">
        <canvas id="route-canvas"></canvas>
    </div>
</div>

<!-- ПАНЕЛЬ КОРПУСОВ (выезжает) -->
<div class="buildings-panel" id="buildingsPanel">
    <div class="panel-header" id="panelHeader">
        <span>📋 Корпуса и отделения</span>
        <span class="panel-arrow" id="panelArrow">▲</span>
    </div>
    <div class="buildings-list" id="buildingsList"></div>
</div>

<!-- ПАНЕЛЬ ПОДСКАЗКИ (всегда внизу, одинаковой высоты с панелью корпусов) -->
<div class="hint-panel" id="hintPanel">
    <div class="hint-text">
        <span class="emoji">👆</span> Нажми на корпус, чтобы построить маршрут
    </div>
</div>

<div class="route-panel hidden" id="routePanel">
    <span class="route-info" id="routeInfo"></span>
    <button class="btn-reset" id="btnReset">✕ Сбросить</button>
</div>

<script>
    // === ДАННЫЕ ===
    const IMG_W = 2016, IMG_H = 864;
    const METERS_PER_PX = 0.25;

    const BUILDINGS = [
        { id: 1, name: 'Главный корпус', gx: 1220, gy: 370, departments: 'Терапия, кардиология' }
    ];
    const CALLOUTS = [
        { id: 1, gx: 1218, gy: 205, buildingId: 1 }
    ];
    const QR_POINTS = [
        { id: 'qr_gate', name: 'КПП', gx: 1301, gy: 684 }
    ];
    const WAYPOINTS = [
        { id: 'W0', gx: 1314, gy: 689 },
        { id: 'W1', gx: 1402, gy: 659 },
        { id: 'W2', gx: 1491, gy: 580 },
        { id: 'W3', gx: 1401, gy: 482 },
        { id: 'W4', gx: 1314, gy: 404 }
    ];

    let ALL_NODES = {}, GRAPH = {};

    function addNode(key, obj) {
        ALL_NODES[key] = obj;
        GRAPH[key] = GRAPH[key] || {};
    }
    function addEdge(a, b) {
        const dx = ALL_NODES[a].gx - ALL_NODES[b].gx;
        const dy = ALL_NODES[a].gy - ALL_NODES[b].gy;
        const d = Math.hypot(dx, dy);
        GRAPH[a][b] = d;
        GRAPH[b][a] = d;
    }
    function initGraph() {
        ALL_NODES = {}; GRAPH = {};
        BUILDINGS.forEach(b => addNode('B' + b.id, b));
        WAYPOINTS.forEach(w => addNode(w.id, w));
        QR_POINTS.forEach(q => addNode(q.id, q));
        [
            ['W0','W1'], ['W1','W2'], ['W2','W3'], ['W3','W4'],
            ['B1','W4'], ['qr_gate','W0']
        ].forEach(e => addEdge(e[0], e[1]));
    }

    function findPath(startKey, toBldId) {
        const toKey = 'B' + toBldId;
        const dist = {}, prev = {};
        Object.keys(ALL_NODES).forEach(k => dist[k] = Infinity);
        dist[startKey] = 0;
        let unvisited = Object.keys(ALL_NODES);
        while (unvisited.length) {
            let minIdx = 0;
            for (let i = 1; i < unvisited.length; i++)
                if (dist[unvisited[i]] < dist[unvisited[minIdx]]) minIdx = i;
            const current = unvisited[minIdx];
            unvisited.splice(minIdx, 1);
            if (dist[current] === Infinity || current === toKey) break;
            const neighbors = GRAPH[current];
            if (neighbors) Object.keys(neighbors).forEach(nb => {
                const alt = dist[current] + neighbors[nb];
                if (alt < dist[nb]) { dist[nb] = alt; prev[nb] = current; }
            });
        }
        if (dist[toKey] === Infinity) return null;
        const path = [toKey];
        let cur = toKey;
        while (cur !== startKey) { cur = prev[cur]; path.unshift(cur); }
        return { nodes: path, distance: dist[toKey] };
    }

    // === РАБОТА С КАРТОЙ ===
    let currentScale = 1;
    let mapImage = document.getElementById('map-image');
    let mapWrapper = document.getElementById('mapWrapper');
    let mapArea = document.getElementById('mapArea');
    let routeCanvas = document.getElementById('route-canvas');
    let ctx = routeCanvas.getContext('2d');

    function updateImageScale() {
        const containerHeight = mapArea.clientHeight;
        if (containerHeight <= 0) return;
        currentScale = containerHeight / IMG_H;
        const newWidth = IMG_W * currentScale;
        mapImage.style.height = `${containerHeight}px`;
        mapImage.style.width = `${newWidth}px`;
        mapWrapper.style.width = `${newWidth}px`;
    }

    function scaleCoord(gx, gy) {
        return { x: gx * currentScale, y: gy * currentScale };
    }

    let markers = { buildings: {}, callouts: {}, start: null };
    let state = {
        startKey: 'qr_gate', startGx: 1301, startGy: 684,
        toBldId: null, routeDistance: 0, currentRouteNodes: null
    };

    function updateMarkers() {
        const scrollLeft = mapArea.scrollLeft;
        BUILDINGS.forEach(b => {
            const pos = scaleCoord(b.gx, b.gy);
            const screenX = pos.x - scrollLeft;
            const screenY = pos.y;
            let m = markers.buildings[b.id];
            if (!m) {
                m = document.createElement('div');
                m.className = 'marker';
                m.innerHTML = b.id;
                m.addEventListener('click', () => setRoute(b.id));
                mapWrapper.appendChild(m);
                markers.buildings[b.id] = m;
            }
            m.style.left = screenX + 'px';
            m.style.top = screenY + 'px';
            if (state.toBldId === b.id) m.classList.add('target');
            else m.classList.remove('target');
        });
        CALLOUTS.forEach(c => {
            const pos = scaleCoord(c.gx, c.gy);
            const screenX = pos.x - scrollLeft;
            const screenY = pos.y;
            let m = markers.callouts[c.id];
            if (!m) {
                m = document.createElement('div');
                m.className = 'marker marker-callout';
                m.addEventListener('click', () => setRoute(c.buildingId));
                mapWrapper.appendChild(m);
                markers.callouts[c.id] = m;
            }
            m.style.left = screenX + 'px';
            m.style.top = screenY + 'px';
        });
        if (state.startGx !== null) {
            const pos = scaleCoord(state.startGx, state.startGy);
            const screenX = pos.x - scrollLeft;
            const screenY = pos.y;
            if (!markers.start) {
                markers.start = document.createElement('div');
                markers.start.className = 'marker marker-start';
                markers.start.innerHTML = '📍';
                mapWrapper.appendChild(markers.start);
            }
            markers.start.style.left = screenX + 'px';
            markers.start.style.top = screenY + 'px';
        }
    }

    function drawRoute() {
        routeCanvas.width = mapWrapper.clientWidth;
        routeCanvas.height = mapWrapper.clientHeight;
        ctx.clearRect(0, 0, routeCanvas.width, routeCanvas.height);
        if (!state.currentRouteNodes || !state.startKey) return;
        const scrollLeft = mapArea.scrollLeft;
        const points = [];
        for (let nodeId of state.currentRouteNodes) {
            const n = ALL_NODES[nodeId];
            if (n) {
                const pos = scaleCoord(n.gx, n.gy);
                points.push({ x: pos.x - scrollLeft, y: pos.y });
            }
        }
        if (points.length < 2) return;
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i=1; i<points.length; i++) ctx.lineTo(points[i].x, points[i].y);
        ctx.strokeStyle = '#42A5F5';
        ctx.lineWidth = 5;
        ctx.setLineDash([13,8]);
        ctx.stroke();
        ctx.setLineDash([]);
        const last = points[points.length-1];
        const prev = points[points.length-2];
        if (last && prev) {
            const angle = Math.atan2(last.y - prev.y, last.x - prev.x);
            const as = 12;
            ctx.beginPath();
            ctx.moveTo(last.x, last.y);
            ctx.lineTo(last.x - as*Math.cos(angle-0.45), last.y - as*Math.sin(angle-0.45));
            ctx.lineTo(last.x - as*Math.cos(angle+0.45), last.y - as*Math.sin(angle+0.45));
            ctx.fillStyle = '#1565C0';
            ctx.fill();
        }
    }

    function setRoute(bldId) {
        if (!state.startKey) return;
        if (state.toBldId === bldId) { clearRoute(); return; }
        const res = findPath(state.startKey, bldId);
        if (!res) return;
        state.toBldId = bldId;
        state.routeDistance = res.distance;
        state.currentRouteNodes = res.nodes;
        updateUI();
        drawRoute();
        updateMarkers();
    }

    function clearRoute() {
        state.toBldId = null;
        state.routeDistance = 0;
        state.currentRouteNodes = null;
        updateUI();
        drawRoute();
        updateMarkers();
    }

    function updateUI() {
        const panel = document.getElementById('routePanel');
        const info = document.getElementById('routeInfo');
        if (state.toBldId) {
            const meters = Math.round(state.routeDistance * METERS_PER_PX);
            info.innerHTML = `🚶 до Корпуса ${state.toBldId} <span class="distance-badge">≈ ${meters} м</span>`;
            panel.classList.remove('hidden');
        } else panel.classList.add('hidden');
    }

    function renderBuildingsList() {
        const buildingsList = document.getElementById('buildingsList');
        buildingsList.innerHTML = '';
        BUILDINGS.forEach(b => {
            const div = document.createElement('div');
            div.className = 'building-item';
            div.innerHTML = `
                <div class="building-num">${b.id}</div>
                <div class="building-info">
                    <div class="building-name">${b.name}</div>
                    <div class="building-depts">${b.departments}</div>
                </div>
            `;
            div.addEventListener('click', () => setRoute(b.id));
            buildingsList.appendChild(div);
        });
    }

    function setStartFromQR() {
        const params = new URLSearchParams(window.location.search);
        if (params.get('qr') === 'qr_gate') {
            state.startKey = 'qr_gate';
            state.startGx = 1301;
            state.startGy = 684;
        }
        updateMarkers();
    }

    function scrollToKPP() {
        if (!mapArea || !mapImage) return;
        setTimeout(() => {
            const kppPos = scaleCoord(1301, 684);
            const targetScroll = kppPos.x - (mapArea.clientWidth / 2);
            mapArea.scrollLeft = Math.max(0, targetScroll);
        }, 50);
    }

    function resizeLayout() {
        const availableHeight = window.innerHeight;
        const header = document.querySelector('.header');
        const mapAreaEl = document.querySelector('.map-area');
        const buildingsPanel = document.querySelector('.buildings-panel');
        const hintPanel = document.querySelector('.hint-panel');

        // Шапка: 10% от высоты, минимум 70px
        const headerHeight = Math.max(availableHeight * 0.10, 70);
        
        // Высота подсказки и свёрнутой панели корпусов — одинаковы (8% от высоты, минимум 55px)
        const collapsedHeight = Math.max(availableHeight * 0.06, 40);
        
        // Текущая высота панели корпусов (свёрнута или открыта)
        const isOpen = buildingsPanel.classList.contains('open');
        const buildingsHeight = isOpen ? availableHeight * 0.60 : collapsedHeight;
        
        // Высота подсказки всегда одинакова со свёрнутой панелью
        const hintHeight = collapsedHeight;
        
        // Карта занимает оставшееся место
        const mapHeight = availableHeight - headerHeight - buildingsHeight - hintHeight;

        header.style.height = `${headerHeight}px`;
        mapAreaEl.style.height = `${mapHeight}px`;
        buildingsPanel.style.height = `${buildingsHeight}px`;
        hintPanel.style.height = `${hintHeight}px`;

        updateImageScale();
        updateMarkers();
        drawRoute();
        scrollToKPP();
    }

    // Управление панелью корпусов
    const buildingsPanel = document.getElementById('buildingsPanel');
    const panelHeader = document.getElementById('panelHeader');
    const panelArrow = document.getElementById('panelArrow');

    panelHeader.addEventListener('click', () => {
        buildingsPanel.classList.toggle('open');
        panelArrow.classList.toggle('open');
        resizeLayout();
        setTimeout(() => {
            updateImageScale();
            updateMarkers();
            drawRoute();
        }, 50);
    });

    // СОБЫТИЯ
    document.getElementById('openFullscreenBtn').addEventListener('click', () => {
        window.open('hospital-map.png', '_blank');
    });
    document.getElementById('btnReset').addEventListener('click', clearRoute);

    mapArea.addEventListener('scroll', () => {
        updateMarkers();
        drawRoute();
    });
    window.addEventListener('resize', () => resizeLayout());

    // СТАРТ
    initGraph();
    renderBuildingsList();
    setStartFromQR();
    resizeLayout();
</script>
</body>
</html>
