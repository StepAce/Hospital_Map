<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1565C0">
    <title>Инфекционная больница — навигация</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            touch-action: manipulation; /* Отключает двойной тап для зума */
            -webkit-text-size-adjust: 100%; /* Отключает авто-зум текста на iOS */
        }

        body {
            background: #1a1a2e;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== ШАПКА ===== */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 12px;
            background: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
            z-index: 1000;
            font-family: 'Inter', sans-serif;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            min-width: 0;
        }
        .header-logo {
            height: 48px;
            width: auto;
            border-radius: 10px;
        }
        .header-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        .hospital-name {
            font-size: 16px;
            font-weight: 700;
            color: #1a1a2e;
            line-height: 1.2;
            white-space: normal;
            font-family: 'Inter', sans-serif;
        }
        .subtitle {
            font-size: 11px;
            color: #1565C0;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
        }
        .btn-install {
            background: #ffffff;
            color: #1a1a2e;
            border: 1px solid #1a1a2e;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .btn-install:active { transform: scale(0.96); }
        @media (max-width: 600px) {
            .header-logo { height: 40px; }
            .hospital-name { font-size: 14px; }
            .subtitle { font-size: 10px; }
            .btn-install { padding: 6px 12px; font-size: 11px; }
            .header { padding: 6px 10px; }
        }

        /* ===== КАРТА ===== */
        .map-wrapper {
            flex: 0 0 auto;
            position: relative;
            background: #1a1a2e;
            width: 100%;
        }
        .map-scroll-container {
            width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x;
            overscroll-behavior: contain;
            position: relative;
            cursor: ew-resize;
        }
        .map-scroll-container img {
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }
        #markersLayer {
            position: absolute;
            top: 0; left: 0;
            pointer-events: none;
        }
        #markersLayer > * { pointer-events: auto; }

        .pin-container {
            position: absolute;
            width: clamp(30px, 5vw, 48px);
            height: clamp(40px, 6.67vw, 64px);
            transform: translate(-50%, -100%);
            transform-origin: bottom center;
            transition: transform 0.35s ease;
        }
        .pin {
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 83.333%;
            height: 85%;
            transform: translateX(-50%);
            animation: pin-bounce 2s ease-in-out infinite;
            z-index: 3;
        }
        .pin svg {
            width: 100%;
            height: 100%;
        }
        @keyframes pin-bounce {
            0%, 100% { transform: translateX(-50%) translateY(-10px); }
            50% { transform: translateX(-50%) translateY(0px); }
        }
        @keyframes pin-bounce-small {
            0%, 100% { transform: translateX(-50%) translateY(-7px); }
            50% { transform: translateX(-50%) translateY(0px); }
        }
        @keyframes dash-run {
            0% { stroke-dashoffset: 0; }
            100% { stroke-dashoffset: -28; }
        }
        .building-marker {
            position: absolute;
            width: clamp(30px, 4.5vw, 48px); height: clamp(30px, 4.5vw, 48px);
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid #000000;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: clamp(14px, 2.5vw, 24px);
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transform: translate(-50%, -50%);
            transition: transform 0.35s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .dept-dot {
            position: absolute;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #1565C0;
            border: 2px solid #ffffff;
            cursor: pointer;
            z-index: 7;
            transition: transform 0.15s ease, width 0.15s ease, height 0.15s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .dept-dot:hover, .dept-dot:active {
            width: 14px;
            height: 14px;
        }

        /* ===== ПАНЕЛЬ КОРПУСОВ ===== */
        .buildings-panel {
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
            overflow: hidden;
            z-index: 1000;
            height: 46px;
        }
        
        .panel-header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            color: #1a1a2e;
            border-bottom: 1px solid #e0e0e0;
            flex-shrink: 0;
            min-height: 46px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
        }
        .panel-arrow {
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .panel-arrow svg {
            width: 20px;
            height: 20px;
            transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .panel-arrow.open svg {
            transform: rotate(180deg);
        }
        .buildings-list {
            height: calc(100% - 46px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .building-item {
            border-bottom: 1px solid #e0e0e0;
            font-family: 'Inter', sans-serif;
        }

        .building-row {
            display: flex; align-items: center; gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            min-height: 52px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            font-family: 'Inter', sans-serif;
        }
        .building-row:active { }
        .building-item.selected .building-name { color: #1565C0; }

        .building-arrow {
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a2e;
        }
        .building-arrow svg {
            width: 18px;
            height: 18px;
            transition: transform 0.3s ease;
        }
        .building-arrow.expanded svg {
            transform: rotate(90deg);
        }

        .depts-container {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .depts-container.expanded { max-height: 300px; }

        .dept-item {
            padding: 10px 20px 10px 68px;
            font-size: 14px;
            color: #1a1a2e;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            border-top: 1px solid #f0f0f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dept-reset {
            display: none;
            width: 20px;
            height: 20px;
            font-size: 14px;
            color: #E53935;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 20px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .dept-item.active .dept-reset { display: block; }
        .dept-item.active { background: #E3F2FD; }
        .building-num {
            width: 34px; height: 34px;
            background: #ffffff;
            border-radius: 50%;
            border: 1px solid #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #000000;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
        }
        .building-info { flex: 1; min-width: 0; }
        .building-name { font-weight: 600; font-size: 16px; color: #263238; font-family: 'Inter', sans-serif; }
        .building-depts { font-size: 12px; color: #90A4AE; font-family: 'Inter', sans-serif; }

        /* ===== ПАНЕЛЬ ПОДСКАЗКИ ===== */
        .hint-panel {
            background: #ffffff;
            border-top: 1px solid #e0e0e0;
            flex-shrink: 0;
            z-index: 1000;
        }
        .hint-text {
            padding: 8px 20px;
            font-size: 13px; color: #1a1a2e;
            display: flex; align-items: center; gap: 6px;
            justify-content: space-between;
            min-height: 38px;
            font-family: 'Inter', sans-serif;
        }
        .hint-text .emoji {
            display: inline-block;
            animation: bounce 1.3s ease-in-out infinite;
        }
        .hint-reset {
            display: none;
            width: 20px;
            height: 20px;
            font-size: 14px;
            color: #E53935;
            cursor: pointer;
            flex-shrink: 0;
            line-height: 20px;
            text-align: center;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }

        body.panel-open .pin-container {
            transform: translate(-50%, -100%) scale(0.7);
        }
        body.panel-open .pin {
            animation-name: pin-bounce-small;
        }
        body.panel-open .building-marker {
            transform: translate(-50%, -50%) scale(0.7);
        }
        body.panel-open .dept-dot {
        }

        .route-running {
            animation: dash-run 1s linear infinite;
        }

        .pin-container.route-active .pin { animation: none; }

        .start-label {
            position: absolute;
            background: rgba(255,255,255,0.6);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            color: #1a1a2e;
            text-align: center;
            border: 0.5px solid rgba(0,0,0,0.08);
            font-family: 'Inter', sans-serif;
            white-space: nowrap;
        }
        .label-dot {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: rgba(231, 6, 6, 0.9);
            border: 2px solid white;
        }

        body.panel-open .start-label {
            display: none;
        }
        body.panel-open .label-dot {
            display: none;
        }

    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <img src="icon-192.png" alt="Логотип" class="header-logo">
        <div class="header-text">
            <div class="hospital-name">ГБУЗ "Инфекционная больница №2"</div>
            <div class="subtitle">Навигационная карта</div>
        </div>
    </div>
    <button class="btn-install" id="installBtn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>Добавить</button>
</div>

<div class="map-wrapper" id="mapWrapper">
    <div class="map-scroll-container" id="mapScrollContainer">
        <img id="mapImage" alt="Карта больницы">
        <div id="markersLayer"></div>
    </div>
</div>

<div class="buildings-panel" id="buildingsPanel">
    <div class="panel-header" id="panelHeader">
        <span><img src="icons/hospital.svg" alt="Корпуса" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 6px;">Корпуса и отделения</span>
        <span class="panel-arrow" id="panelArrow"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></span>
    </div>
    <div class="buildings-list" id="buildingsList"></div>
</div>

<div class="hint-panel">
    <div class="hint-text" id="hintText">
        <span id="hintLabel">Откройте вкладку для ознакомления</span>
        <span class="emoji" id="hintEmoji"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/></svg></span>
        <span class="hint-reset" id="hintReset" style="display:none">&times;</span>
    </div>
</div>

<script>
(function() {
    'use strict';

    // === СОСТОЯНИЕ ===
    var deferredPrompt = null;
    var appData = null;
    var scale = 1;
    var allNodes = {};
    var graph = {};
    var startKey = 'qr_gate';
    var selectedBuildingId = null;
    var selectedDeptId = null;
    var selectedDeptName = null;
    var buildingMarkerEls = {};
    var startPinEl = null;
    var labelEls = [];
    var metersPerPixel = 0.25;
    var PIN_OFFSET_Y = 8;
    var PIN_OFFSET_X = 0;
    var scrollContainer = null;
    var mapSizes = null;
    var hintLabel = null;
    var hintEmoji = null;
    var hintReset = null;

    function updateHint() {
        var panel = document.getElementById('buildingsPanel');
        var isPanelOpen = panel.classList.contains('open');

        if (selectedDeptId) {
            var building = findBuildingById(selectedBuildingId);
            hintLabel.textContent = (building ? building.name : '') + ', ' + selectedDeptName;
            hintEmoji.style.display = 'none';
            hintReset.style.display = 'block';
        } else if (!isPanelOpen) {
            hintLabel.textContent = 'Откройте вкладку для ознакомления';
            hintEmoji.style.display = 'inline-block';
            hintReset.style.display = 'none';
        } else {
            var anyExpanded = document.querySelector('.depts-container.expanded');
            if (anyExpanded) {
                hintLabel.textContent = 'Выберите отделение для построения маршрута';
                hintEmoji.style.display = 'none';
                hintReset.style.display = 'none';
            } else {
                hintLabel.textContent = 'Выберите корпус';
                hintEmoji.style.display = 'inline-block';
                hintReset.style.display = 'none';
            }
        }
    }

    // === ЗАГРУЗКА ДАННЫХ ===
    async function loadData() {
        var resp = await fetch('data.json');
        if (!resp.ok) throw new Error('Не удалось загрузить data.json');
        appData = await resp.json();
        metersPerPixel = appData.config.metersPerPixel;
    }

    // === ПОСТРОЕНИЕ ГРАФА ===
    function buildGraph() {
        allNodes = {};
        graph = {};

        appData.buildings.forEach(function(b) {
            var key = 'B' + b.id;
            allNodes[key] = { x: b.x, y: b.y, name: b.name, isBuilding: true, buildingId: b.id };
            graph[key] = {};
        });

        appData.startPoints.forEach(function(s) {
            allNodes[s.id] = { x: s.x, y: s.y, name: s.name, isStart: true };
            graph[s.id] = {};
        });

        var addEdge = function(a, b) {
            if (!allNodes[a] || !allNodes[b]) return;
            var dx = allNodes[a].x - allNodes[b].x;
            var dy = allNodes[a].y - allNodes[b].y;
            var dist = Math.hypot(dx, dy);
            graph[a][b] = dist;
            graph[b][a] = dist;
        };

        appData.buildings.forEach(function(b) {
            var depts = getDeptObjects(b.departments);
            depts.forEach(function(d) {
                var deptKey = 'D' + d.id;
                allNodes[deptKey] = { x: d.x, y: d.y, name: d.name, isDept: true, buildingId: b.id, deptId: d.id };
                graph[deptKey] = {};

                var wpts = d.waypoints;
                if (wpts && wpts.length > 0) {
                    wpts.forEach(function(w) {
                        if (!allNodes[w.id]) {
                            allNodes[w.id] = { x: w.x, y: w.y, isWaypoint: true };
                            graph[w.id] = {};
                        }
                    });

                    addEdge(startKey, wpts[0].id);

                    for (var i = 0; i < wpts.length - 1; i++) {
                        addEdge(wpts[i].id, wpts[i + 1].id);
                    }

                    addEdge(wpts[wpts.length - 1].id, deptKey);
                }
            });
        });

        if (appData.waypoints) {
            appData.waypoints.forEach(function(w) {
                if (!allNodes[w.id]) {
                    allNodes[w.id] = { x: w.x, y: w.y, isWaypoint: true };
                    graph[w.id] = {};
                }
            });
        }

        if (appData.graph && appData.graph.edges) {
            appData.graph.edges.forEach(function(e) {
                addEdge(e[0], e[1]);
            });
        }
    }

    // === АЛГОРИТМ ДЕЙКСТРЫ ===
    function findPath(fromKey, toKey) {
        if (!allNodes[fromKey] || !allNodes[toKey]) return null;
        var dist = {}, prev = {};
        Object.keys(allNodes).forEach(function(k) { dist[k] = Infinity; });
        dist[fromKey] = 0;
        var unvisited = Object.keys(allNodes).slice();
        while (unvisited.length) {
            var minIdx = 0;
            for (var i = 1; i < unvisited.length; i++) {
                if (dist[unvisited[i]] < dist[unvisited[minIdx]]) minIdx = i;
            }
            var current = unvisited[minIdx];
            unvisited.splice(minIdx, 1);
            if (dist[current] === Infinity || current === toKey) break;
            var neighbors = graph[current];
            if (neighbors) {
                Object.keys(neighbors).forEach(function(nb) {
                    var alt = dist[current] + neighbors[nb];
                    if (alt < dist[nb]) { dist[nb] = alt; prev[nb] = current; }
                });
            }
        }
        if (dist[toKey] === Infinity) return null;
        var path = [toKey];
        var cur = toKey;
        while (cur !== fromKey) { cur = prev[cur]; path.unshift(cur); }
        return { nodes: path, distance: dist[toKey] };
    }

    // === ИНИЦИАЛИЗАЦИЯ КАРТЫ ===
    function initMap() {
        var cfg = appData.config;
        var img = document.getElementById('mapImage');
        var wrapper = document.getElementById('mapWrapper');
        scrollContainer = document.getElementById('mapScrollContainer');

        return new Promise(function(resolve, reject) {
            img.onload = function() {
                recalculateLayout();
                resolve();
            };
            img.onerror = function() {
                reject(new Error('Не удалось загрузить изображение карты'));
            };
            img.src = cfg.mapImage;
        });
    }

    // === ЛОГИКА МАСШТАБИРОВАНИЯ ===
    function applyScale(forceWidthMode) {
        var wrapper = document.getElementById('mapWrapper');
        var img = document.getElementById('mapImage');
        
        var wrapperWidth = wrapper.clientWidth;
        var naturalWidth = img.naturalWidth;
        var naturalHeight = img.naturalHeight;
        
        var sp = allNodes[startKey];
        var anchorX = sp ? sp.x * scale : 0;

        var totalWidth, totalHeight;
        
        if (forceWidthMode) {
            scale = wrapperWidth / naturalWidth;
            totalWidth = wrapperWidth;
            totalHeight = naturalHeight * scale;
        } else {
            var availableHeight = getAvailableHeight();
            scale = availableHeight / naturalHeight;
            totalWidth = naturalWidth * scale;
            totalHeight = availableHeight;
        }

        mapSizes = { totalWidth: totalWidth, totalHeight: totalHeight };

        wrapper.style.height = totalHeight + 'px';
        img.style.width = totalWidth + 'px';
        img.style.height = totalHeight + 'px';

        var markersLayer = document.getElementById('markersLayer');
        markersLayer.style.width = totalWidth + 'px';
        markersLayer.style.height = totalHeight + 'px';
    }

    function getAvailableHeight() {
        var viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        var header = document.querySelector('.header');
        var hintPanel = document.querySelector('.hint-panel');
        var buildingsPanel = document.getElementById('buildingsPanel');
        
        var usedHeight = 0;
        if (header) usedHeight += header.offsetHeight;
        if (hintPanel) usedHeight += hintPanel.offsetHeight;
        if (buildingsPanel) {
            usedHeight += buildingsPanel.offsetHeight;
        }
        
        return viewportHeight - usedHeight;
    }

    function repositionMarkers() {
        if (startPinEl) {
            var kppDept = findDeptById(1001);
            if (kppDept) {
                startPinEl.style.left = (kppDept.x * scale + PIN_OFFSET_X) + 'px';
                startPinEl.style.top = (kppDept.y * scale - PIN_OFFSET_Y) + 'px';
            }
        }
        labelEls.forEach(function(item) {
            var lbl = item.data;
            item.badge.style.left = (lbl.label_x * scale) + 'px';
            item.badge.style.top = (lbl.label_y * scale) + 'px';
            item.dot.style.left = (lbl.dot_x * scale - 8) + 'px';
            item.dot.style.top = (lbl.dot_y * scale - 8) + 'px';
        });
        Object.keys(buildingMarkerEls).forEach(function(bid) {
            var b = findBuildingById(parseInt(bid));
            if (!b) return;
            var dot = buildingMarkerEls[bid];
            dot.style.left = (b.x * scale) + 'px';
            dot.style.top = (b.y * scale) + 'px';
        });
    }

    function findBuildingById(id) {
        return appData.buildings.find(function(b) { return b.id === id; });
    }

    // === ОТРИСОВКА МАРКЕРОВ ===
    function renderMarkers() {
        var markersLayer = document.getElementById('markersLayer');

        var kppDept = findDeptById(1001);
        if (kppDept) {
            var container = document.createElement('div');
            container.className = 'pin-container';
            container.style.left = (kppDept.x * scale + PIN_OFFSET_X) + 'px';

    var lastRouteNodeIds = null;

    function setRoute(buildingId, deptId, deptName) {
        var toKey;
        if (deptId) {
            if (selectedDeptId === deptId) { clearRoute(); return; }
            toKey = 'D' + deptId;
        } else {
            if (selectedBuildingId === buildingId && !selectedDeptId) { clearRoute(); return; }
            toKey = 'B' + buildingId;

        var result = findPath(startKey, toKey);

        selectedBuildingId = buildingId;

        updateBuildingsListSelection();
        scrollToRoute(result.nodes);

    function scrollToRoute(nodeIds) {
        if (!scrollContainer || !mapSizes) return;
        var minX = Infinity, maxX = -Infinity;
        nodeIds.forEach(function(id) {
            var n = allNodes[id];
            var sx = n.x * scale;
            if (sx < minX) minX = sx;
            if (sx > maxX) maxX = sx;
        });
        var centerX = (minX + maxX) / 2;
        var halfView = scrollContainer.clientWidth / 2;
        scrollContainer.scrollTo({ left: Math.max(0, centerX - halfView), behavior: 'smooth' });
    }

    function buildSmoothPathData(nodeIds) {
        if (nodeIds.length < 2) return '';
        var CURVE = 0.25;
        var pts = nodeIds.map(function(id) {
            var n = allNodes[id];
            return { x: n.x * scale, y: n.y * scale };
        });

        var d = 'M ' + pts[0].x + ' ' + pts[0].y;

        if (pts.length === 2) {
            d += ' L ' + pts[1].x + ' ' + pts[1].y;
            return d;
        }

        var f = 0.5 * CURVE;
        var mx = pts[0].x + (pts[1].x - pts[0].x) * f;
        var my = pts[0].y + (pts[1].y - pts[0].y) * f;
        d += ' L ' + mx + ' ' + my;

        for (var i = 1; i < pts.length - 1; i++) {
            var mx2 = pts[i].x + (pts[i + 1].x - pts[i].x) * f;
            var my2 = pts[i].y + (pts[i + 1].y - pts[i].y) * f;
            d += ' Q ' + pts[i].x + ' ' + pts[i].y + ' ' + mx2 + ' ' + my2;
        }

        d += ' L ' + pts[pts.length - 1].x + ' ' + pts[pts.length - 1].y;
        return d;
    }

    function drawRouteLine(nodeIds, skipAnimation) {
        clearRouteLine();

        var markersLayer = document.getElementById('markersLayer');
        var svgNS = 'http://www.w3.org/2000/svg';
        var svg = document.createElementNS(svgNS, 'svg');
        svg.setAttribute('id', 'routeSvg');
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.width = '100%';
        svg.style.height = '100%';
        svg.style.pointerEvents = 'none';
        svg.style.zIndex = '10';

        var d = buildSmoothPathData(nodeIds);

        var path = document.createElementNS(svgNS, 'path');
        path.setAttribute('d', d);
        path.setAttribute('fill', 'none');
        path.setAttribute('stroke', '#E53935');
        path.setAttribute('stroke-width', '3.5');
        path.setAttribute('stroke-linecap', 'round');
        path.setAttribute('stroke-linejoin', 'round');

        if (skipAnimation) {
            path.setAttribute('stroke-dasharray', '8 6');
            path.setAttribute('opacity', '0.9');
            path.classList.add('route-running');
            svg.appendChild(path);
            markersLayer.appendChild(svg);
            routeSvgEl = svg;
            routePathEl = path;
        } else {
            var defs = document.createElementNS(svgNS, 'defs');
            var mask = document.createElementNS(svgNS, 'mask');
            mask.setAttribute('id', 'routeMask');
            var maskLine = document.createElementNS(svgNS, 'path');
            maskLine.setAttribute('d', d);
            maskLine.setAttribute('fill', 'none');
            maskLine.setAttribute('stroke', 'white');
            maskLine.setAttribute('stroke-width', '3.5');
            maskLine.setAttribute('stroke-linecap', 'round');
            maskLine.setAttribute('stroke-linejoin', 'round');
            mask.appendChild(maskLine);
            defs.appendChild(mask);
            svg.appendChild(defs);
            path.setAttribute('stroke-dasharray', '8 6');
            path.setAttribute('opacity', '0.9');
            path.setAttribute('mask', 'url(#routeMask)');
            svg.appendChild(path);
            markersLayer.appendChild(svg);
            routeSvgEl = svg;

            requestAnimationFrame(function() {
                var totalLen = maskLine.getTotalLength();
                if (totalLen === 0) return;
                maskLine.setAttribute('stroke-dasharray', totalLen);
                maskLine.setAttribute('stroke-dashoffset', totalLen);
                var duration = 1000;
                var startTime = null;
                function animate(ts) {
                    if (!startTime) startTime = ts;
                    var elapsed = ts - startTime;
                    var t = Math.min(elapsed / duration, 1);
                    var eased = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
                    maskLine.setAttribute('stroke-dashoffset', totalLen * (1 - eased));
                    if (t < 1) {
                        routeAnimId = requestAnimationFrame(animate);
                    } else {
                        routeAnimId = null;
                        path.classList.add('route-running');
                    }
                }
                routeAnimId = requestAnimationFrame(animate);
            });
            return;
        }
    }

    function clearRouteLine() {
        if (routeAnimId) {
            cancelAnimationFrame(routeAnimId);
            routeAnimId = null;
        }
        if (routeSvgEl && routeSvgEl.parentNode) {
            routeSvgEl.parentNode.removeChild(routeSvgEl);
        }
        routeSvgEl = null;
        routePathEl = null;
    }

    function updateRoutePathData(nodeIds) {
        if (!routePathEl) return;
        var d = buildSmoothPathData(nodeIds);
        routePathEl.setAttribute('d', d);

function setupPanelToggle() {
    var panel = document.getElementById('buildingsPanel');
    var header = document.getElementById('panelHeader');
    var arrow = document.getElementById('panelArrow');
    
    var ANIMATION_DURATION = 300;
    var animationId = null;
    var isPanelOpen = false;
    
    function easeInOutCubic(t) {
        return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }
    
    function getTargetHeight(open) {
        if (open) {
            var viewportHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            var headerEl = document.querySelector('.header');
            var hintPanel = document.querySelector('.hint-panel');
            var img = document.getElementById('mapImage');
            var wrapper = document.getElementById('mapWrapper');
            
            var headerHeight = headerEl ? headerEl.offsetHeight : 0;
            var hintHeight = hintPanel ? hintPanel.offsetHeight : 0;
            
            var wrapperWidth = wrapper.clientWidth;
            var mapHeight = (img.naturalHeight * wrapperWidth) / img.naturalWidth;
            
            return viewportHeight - headerHeight - hintHeight - mapHeight;
        }
        return 46;
    }
    
    function animatePanelHeight(fromHeight, toHeight, targetOpen) {
        if (animationId) {
            cancelAnimationFrame(animationId);
        }
        
        var startTime = null;
        
        function step(timestamp) {
            if (!startTime) startTime = timestamp;
            var elapsed = timestamp - startTime;
            var progress = Math.min(elapsed / ANIMATION_DURATION, 1);
            var easedProgress = easeInOutCubic(progress);
            
            var currentHeight = fromHeight + (toHeight - fromHeight) * easedProgress;
            panel.style.height = currentHeight + 'px';
            
            if (scrollContainer) {
                var savedCenter = (scrollContainer.scrollLeft + scrollContainer.clientWidth / 2) / (scale || 1);
            }
            applyScale(false);
            repositionMarkers();
            if (!targetOpen && scrollContainer) {
                var targetCenter = allNodes[startKey] ? allNodes[startKey].x : (savedCenter || 0);
                var lerpedCenter = savedCenter + (targetCenter - savedCenter) * easedProgress;
                scrollContainer.scrollLeft = Math.max(0, lerpedCenter * scale - scrollContainer.clientWidth / 2);
            } else if (targetOpen && scrollContainer) {
                scrollContainer.scrollLeft = Math.max(0, savedCenter * scale - scrollContainer.clientWidth / 2);
            }
            if (lastRouteNodeIds) { updateRoutePathData(lastRouteNodeIds); }

            if (progress < 1) {
                animationId = requestAnimationFrame(step);
            } else {
                animationId = null;
                if (targetOpen) {
                    if (scrollContainer) {
                        var savedCenter = (scrollContainer.scrollLeft + scrollContainer.clientWidth / 2) / (scale || 1);
                    }
                    applyScale(true);
                    repositionMarkers();
                    if (lastRouteNodeIds) { drawRouteLine(lastRouteNodeIds, true); }
                    if (scrollContainer) {
                        scrollContainer.scrollLeft = Math.max(0, savedCenter * scale - scrollContainer.clientWidth / 2);
                    }
                } else {
                    applyScale(false);
                    repositionMarkers();
                    centerOnStartPoint();
                    if (lastRouteNodeIds) { drawRouteLine(lastRouteNodeIds, true); }
                }
            }
        }
        
        animationId = requestAnimationFrame(step);
    }
    
    header.addEventListener('click', function() {
        isPanelOpen = !isPanelOpen;

        if (!isPanelOpen) {
            collapseAllBuildings();
        }
        if (isPanelOpen && selectedBuildingId) {
            expandBuildingAccordion(selectedBuildingId);
        }

        var currentHeight = panel.offsetHeight;
        var targetHeight = getTargetHeight(isPanelOpen);

        if (isPanelOpen) {
            panel.classList.add('open');
            arrow.classList.add('open');
            document.body.classList.add('panel-open');
        } else {
            panel.classList.remove('open');
            arrow.classList.remove('open');
            document.body.classList.remove('panel-open');
        }
        updateHint();

        animatePanelHeight(currentHeight, targetHeight, isPanelOpen);
    });
}

    // === ОБРАБОТКА QR-ПАРАМЕТРА ===
    function handleQRParam() {
        var params = new URLSearchParams(window.location.search);
        var qrVal = params.get('qr');
        if (qrVal) {

    // === ПЕРЕРАСЧЁТ ПРИ ИЗМЕНЕНИИ РАЗМЕРА ОКНА ===
    function recalculateLayout() {
        var img = document.getElementById('mapImage');
        var panel = document.getElementById('buildingsPanel');
        
        if (!img || !img.naturalWidth) return;

        var isPanelOpen = panel.classList.contains('open');
        var savedCenter = scrollContainer ? (scrollContainer.scrollLeft + scrollContainer.clientWidth / 2) / (scale || 1) : null;
        applyScale(isPanelOpen);
        repositionMarkers();
        if (scrollContainer && savedCenter !== null) {
            scrollContainer.scrollLeft = Math.max(0, savedCenter * scale - scrollContainer.clientWidth / 2);
        }
        if (lastRouteNodeIds) {
            updateRoutePathData(lastRouteNodeIds);
        }
    }

    function setupResizeHandler() {
        var resizeTimeout;
        function onResize() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(recalculateLayout, 50);
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', onResize);
        }
        window.addEventListener('resize', onResize);
    }

    // === ЦЕНТРИРОВАНИЕ ПО ТОЧКЕ СТАРТА ===
    function centerOnStartPoint() {
        if (!scrollContainer || !mapSizes) return;
        var node = allNodes[startKey];
        if (!node) return;
        var centerX = node.x * scale;
        var halfView = scrollContainer.getBoundingClientRect().width / 2;
        scrollContainer.scrollTo({ left: Math.max(0, centerX - halfView), behavior: 'smooth' });
    }
