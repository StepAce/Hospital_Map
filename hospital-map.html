<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1565C0">
    <title>Инфекционная больница — навигация</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        .dept-item.start-selected { background: #E8F5E9; border-left: 3px solid #4CAF50; }
        .building-item.start-selected .building-name { color: #2E7D32; }
    </style>
</head>
<body>

<div class="welcome-overlay" id="welcomeModal">
    <div class="welcome-card">
        <button class="welcome-close-btn" id="btnWelcomeClose">&times;</button>
        <img src="icon-192.png" alt="Логотип" class="welcome-logo-img">
        <h2 class="welcome-title">ГБУЗ "Инфекционная больница №2"</h2>
        <p class="welcome-subtitle">Необходимо выбрать начальную точку</p>
        <div id="qr-reader" class="qr-reader-container"></div>
        <div class="welcome-actions" id="welcomeActions">
            <button class="welcome-btn welcome-btn-scan" id="btnScanQR">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
                Отсканировать QR-код здания
            </button>
            <button class="welcome-btn welcome-btn-manual" id="btnManualSelect">
                <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
                Выбрать отделение вручную
            </button>
        </div>
        <button class="welcome-btn welcome-btn-cancel" id="btnCancelScan" style="display:none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Отмена
        </button>
    </div>
</div>

<div class="header">
    <div class="header-left">
        <img src="icon-192.png" alt="Логотип" class="header-logo">
        <div class="header-text">
            <div class="hospital-name">ГБУЗ "Инфекционная больница №2"</div>
            <div class="subtitle">Навигационная карта</div>
        </div>
    </div>
    <button class="btn-install" id="installBtn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>Добавить</button>
</div>

<div class="map-wrapper" id="mapWrapper">
    <div class="map-scroll-container" id="mapScrollContainer">
        <img id="mapImage" src="hospital-map.webp" alt="Карта больницы">
        <div id="markersLayer"></div>
    </div>
</div>

<div class="buildings-panel" id="buildingsPanel">
    <div class="panel-header" id="panelHeader">
        <span>Выберите своё месторасположение</span>
        <span class="panel-arrow" id="panelArrow"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></span>
    </div>
    <div class="buildings-list" id="buildingsList"></div>
</div>

<!-- Офлайн-заглушка: показывается, если данные не загрузились без интернета -->
<div id="offlineNotice" style="display:none; background:#ffebee; border-top:2px solid #e53935; padding:14px 20px; text-align:center; font-family:'Inter',sans-serif; font-size:14px; font-weight:600; color:#c62828; flex-shrink:0; z-index:1000;">Нет соединения. Загрузите приложение при наличии интернета.</div>

<div class="hint-panel">
    <div class="hint-text" id="hintText">
        <span id="hintLabel">Откройте вкладку для ознакомления</span>
        <span class="emoji" id="hintEmoji"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/></svg></span>
        <span class="hint-reset" id="hintReset" style="display:none">&times;</span>
    </div>
</div>

<script src="map.js"></script>
<script src="ui.js"></script>
</body>
</html>
