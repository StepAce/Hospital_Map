<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1565C0">
    <title>Инфекционная больница — навигация</title>
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .dept-item.start-selected { background: #E8F5E9; border-left: 3px solid #4CAF50; }
        .building-item.start-selected .building-name { color: #2E7D32; }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <img src="icon-192.png" alt="Логотип" class="header-logo">
        <div class="header-text">
            <div class="hospital-name">ГБУЗ "Инфекционная больница №2"</div>
            <div class="subtitle">Навигационная карта</div>
        </div>
    </div>
    <button class="btn-install" id="installBtn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/></svg>Добавить</button>
</div>

<div class="map-wrapper" id="mapWrapper">
    <div class="map-scroll-container" id="mapScrollContainer">
        <img id="mapImage" alt="Карта больницы">
        <div id="markersLayer"></div>
    </div>
</div>

<div class="buildings-panel" id="buildingsPanel">
    <div class="panel-header" id="panelHeader">
        <span><img src="icons/hospital.svg" alt="Корпуса" style="width: 24px; height: 24px; vertical-align: middle; margin-right: 6px;">📍 Где я нахожусь?</span>
        <span class="panel-arrow" id="panelArrow"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg></span>
    </div>
    <div id="gpsHint" style="padding:8px 20px; font-size:13px; color:#666; cursor:pointer; border-bottom:1px solid #e0e0e0; font-family:'Inter',sans-serif;\">📍 Определить моё местоположение по GPS</div>
    <div class="buildings-list" id="buildingsList"></div>
</div>

<!-- Офлайн-заглушка: показывается, если данные не загрузились без интернета -->
<div id="offlineNotice" style="display:none; background:#ffebee; border-top:2px solid #e53935; padding:14px 20px; text-align:center; font-family:'Inter',sans-serif; font-size:14px; font-weight:600; color:#c62828; flex-shrink:0; z-index:1000;">Нет соединения. Загрузите приложение при наличии интернета.</div>

<div class="hint-panel">
    <div class="hint-text" id="hintText">
        <span id="hintLabel">Откройте вкладку для ознакомления</span>
        <span class="emoji" id="hintEmoji"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 11-5-5-5 5"/><path d="m17 18-5-5-5 5"/></svg></span>
        <button id="btnChangeStart" style="display:none; background:#fff; border:1px solid #1565C0; color:#1565C0; padding:4px 10px; border-radius:14px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; flex-shrink:0;">✎ Сменить</button>
        <button id="btnResetStart" style="display:none; background:#fff; border:1px solid #e53935; color:#e53935; padding:4px 10px; border-radius:14px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; flex-shrink:0;">↺ КПП</button>
        <button id="btnGPS" style="display:none; background:#fff; border:1px solid #4CAF50; color:#4CAF50; padding:4px 10px; border-radius:14px; font-size:12px; font-weight:600; cursor:pointer; font-family:'Inter',sans-serif; white-space:nowrap; flex-shrink:0;">📍 GPS</button>
        <span class="hint-reset" id="hintReset" style="display:none">&times;</span>
    </div>
</div>

<script src="map.js"></script>
<script src="ui.js"></script>
</body>
</html>
