<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Больница — навигация</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body { background: #1a1a2e; overflow: hidden; touch-action: none; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        #map-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }
        
        #map-image {
            position: absolute;
            transform-origin: 0 0;
            width: 2016px;
            height: 864px;
            pointer-events: none;
        }
        
        .marker {
            position: absolute;
            width: 34px;
            height: 34px;
            border-radius: 8px;
            transform: translate(-50%, -50%);
            pointer-events: auto;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #5D4037;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.2);
        }
        
        .marker-building {
            background: #D7CCC8;
            border: 2px solid #8D6E63;
        }
        
        .marker-building.target {
            box-shadow: 0 0 0 4px rgba(21,101,192,0.55);
            border-color: #1565C0;
        }
        
        .marker-start {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #2E7D32;
            border: 3px solid white;
            font-size: 17px;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46,125,50,0.7); }
            70% { box-shadow: 0 0 0 15px rgba(46,125,50,0); }
            100% { box-shadow: 0 0 0 0 rgba(46,125,50,0); }
        }
        
        .marker-callout {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(21,101,192,0.45);
            border: 1.5px solid rgba(21,101,192,0.7);
        }
        
        #route-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }
        
        .sidebar {
            position: fixed;
            right: 0;
            top: 0;
            bottom: 0;
            z-index: 20;
            width: 290px;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(8px);
            box-shadow: -2px 0 16px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
        }
        
        .sidebar-header {
            padding: 10px 15px;
            font-size: 14px;
            font-weight: 700;
            color: #263238;
            border-bottom: 1px solid #E0E0E0;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .sidebar-table-wrapper {
            overflow-y: auto;
            flex: 1;
        }
        
        .bld-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        
        .bld-row {
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid #F5F5F5;
        }
        .bld-row:hover { background: #F5F5F5; }
        .bld-row.highlighted { background: #E3F2FD; }
        
        .bld-num {
            width: 38px;
            text-align: center;
            padding: 8px 4px;
        }
        
        .bld-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #EEEEEE;
            color: #757575;
            font-weight: 700;
            font-size: 13px;
        }
        
        .bld-name {
            font-weight: 600;
            color: #263238;
            padding: 8px 2px;
        }
        
        .bld-depts {
            color: #90A4AE;
            font-size: 11px;
            padding: 8px 10px;
        }
        
        .route-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: white;
            border-radius: 14px;
            padding: 13px 18px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            z-index: 20;
        }
        
        .route-info {
            font-size: 14px;
            font-weight: 500;
            color: #263238;
        }
        
        .distance-badge {
            background: #42A5F5;
            color: white;
            padding: 4px 11px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 17px;
        }
        
        .btn-reset {
            background: #EF5350;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-reset:active { transform: scale(0.96); }
        
        .hidden { display: none !important; }
        
        @media (max-width: 768px) {
            .sidebar {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-height: 40vh;
                border-radius: 16px 16px 0 0;
            }
        }
    </style>
</head>
<body>
<div id="map-container">
    <img id="map-image" src="hospital-map.png" alt="Карта">
    <canvas id="route-canvas"></canvas>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">📋 Корпуса больницы</div>
    <div class="sidebar-table-wrapper">
        <table class="bld-table">
            <tbody id="buildingsTableBody"></tbody>
        </table>
    </div>
</div>

<div class="route-panel hidden" id="routePanel">
    <span class="route-info" id="routeInfo"></span>
    <button class="btn-reset" id="btnReset">✕ Сбросить маршрут</button>
</div>

<script>
    // === ДАННЫЕ ===
    const IMG_W = 2016, IMG_H = 864;
    const METERS_PER_PX = 0.25;
    
    const BUILDINGS = [
        { id: 1, name: 'Главный корпус', gx: 1220, gy: 370, departments: '—' }
    ];
    
    const CALLOUTS = [
        { id: 1, gx: 1218, gy: 205, buildingId: 1 }
    ];
    
    const QR_POINTS = [
        { id: 'qr_gate', name: 'КПП', gx: 1301, gy: 684 }
    ];
    
    const WAYPOINTS = [
        { id: 'W0', gx: 1314, gy: 689 },
        { id: 'W1', gx: 1402, gy: 659 },
        { id: 'W2', gx: 1491, gy: 580 },
        { id: 'W3', gx: 1401, gy: 482 },
        { id: 'W4', gx: 1314, gy: 404 }
    ];
    
    // === ГРАФ ДЛЯ МАРШРУТОВ ===
    let ALL_NODES = {};
    let GRAPH = {};
    
    function addNode(key, obj) {
        ALL_NODES[key] = obj;
        GRAPH[key] = GRAPH[key] || {};
    }
    
    function addEdge(a, b) {
        GRAPH[a] = GRAPH[a] || {};
        GRAPH[b] = GRAPH[b] || {};
        const dx = ALL_NODES[a].gx - ALL_NODES[b].gx;
        const dy = ALL_NODES[a].gy - ALL_NODES[b].gy;
        const d = Math.sqrt(dx*dx + dy*dy);
        GRAPH[a][b] = d;
        GRAPH[b][a] = d;
    }
    
    function initGraph() {
        ALL_NODES = {};
        GRAPH = {};
        BUILDINGS.forEach(b => addNode('B' + b.id, b));
        WAYPOINTS.forEach(w => addNode(w.id, w));
        QR_POINTS.forEach(q => addNode(q.id, q));
        
        const edges = [
            ['W0','W1'], ['W1','W2'], ['W2','W3'], ['W3','W4'],
            ['B1','W4'], ['qr_gate','W0']
        ];
        edges.forEach(e => addEdge(e[0], e[1]));
    }
    
    function findPath(startKey, toBldId) {
        const toKey = 'B' + toBldId;
        const dist = {};
        const prev = {};
        const keys = Object.keys(ALL_NODES);
        keys.forEach(k => dist[k] = Infinity);
        dist[startKey] = 0;
        
        const unvisited = keys.slice();
        while (unvisited.length) {
            let minIdx = 0;
            for (let i = 1; i < unvisited.length; i++) {
                if (dist[unvisited[i]] < dist[unvisited[minIdx]]) minIdx = i;
            }
            const current = unvisited[minIdx];
            unvisited.splice(minIdx, 1);
            if (dist[current] === Infinity) break;
            if (current === toKey) break;
            
            const neighbors = GRAPH[current];
            if (!neighbors) continue;
            Object.keys(neighbors).forEach(nb => {
                const alt = dist[current] + neighbors[nb];
                if (alt < dist[nb]) {
                    dist[nb] = alt;
                    prev[nb] = current;
                }
            });
        }
        
        if (dist[toKey] === Infinity) return null;
        const path = [toKey];
        let cur = toKey;
        while (cur !== startKey) {
            cur = prev[cur];
            path.unshift(cur);
        }
        return { nodes: path, distance: dist[toKey] };
    }
    
    // === ТРАНСФОРМАЦИЯ КАРТЫ (ЗУМ + ПАН) ===
    const container = document.getElementById('map-container');
    const img = document.getElementById('map-image');
    const routeCanvas = document.getElementById('route-canvas');
    let ctx = routeCanvas.getContext('2d');
    
    let scale = 1.5;
    let translateX = 0, translateY = 0;
    
    let initialDistance = 0, initialScale = 1;
    let initialTranslateX = 0, initialTranslateY = 0;
    let startPanX = 0, startPanY = 0;
    let isPanning = false;
    
    const KPP_CENTER = { gx: 1301, gy: 684 };
    const KPP_ZOOM = 1.5;
    
    function updateTransform() {
        img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        updateMarkers();
        drawRoute();
    }
    
    function setViewToKPP() {
        const rect = container.getBoundingClientRect();
        scale = KPP_ZOOM;
        translateX = rect.width/2 - KPP_CENTER.gx * scale;
        translateY = rect.height/2 - KPP_CENTER.gy * scale;
        updateTransform();
    }
    
    // === МАРКЕРЫ ===
    let markers = { buildings: {}, callouts: {}, start: null };
    
    function updateMarkers() {
        // Корпуса
        BUILDINGS.forEach(b => {
            const screenX = b.gx * scale + translateX;
            const screenY = b.gy * scale + translateY;
            let marker = markers.buildings[b.id];
            if (!marker) {
                marker = document.createElement('div');
                marker.className = 'marker marker-building';
                marker.innerHTML = b.id;
                marker.addEventListener('click', () => setRoute(b.id));
                container.appendChild(marker);
                markers.buildings[b.id] = marker;
            }
            marker.style.left = screenX + 'px';
            marker.style.top = screenY + 'px';
            if (state.toBldId === b.id) {
                marker.classList.add('target');
            } else {
                marker.classList.remove('target');
            }
        });
        
        // Выноски
        CALLOUTS.forEach(c => {
            const screenX = c.gx * scale + translateX;
            const screenY = c.gy * scale + translateY;
            let marker = markers.callouts[c.id];
            if (!marker) {
                marker = document.createElement('div');
                marker.className = 'marker marker-callout';
                marker.addEventListener('click', () => setRoute(c.buildingId));
                container.appendChild(marker);
                markers.callouts[c.id] = marker;
            }
            marker.style.left = screenX + 'px';
            marker.style.top = screenY + 'px';
        });
        
        // Стартовая точка
        if (state.startGx !== null) {
            const screenX = state.startGx * scale + translateX;
            const screenY = state.startGy * scale + translateY;
            if (!markers.start) {
                markers.start = document.createElement('div');
                markers.start.className = 'marker marker-start';
                markers.start.innerHTML = '📍';
                container.appendChild(markers.start);
            }
            markers.start.style.left = screenX + 'px';
            markers.start.style.top = screenY + 'px';
            markers.start.style.display = 'flex';
        } else if (markers.start) {
            markers.start.style.display = 'none';
        }
    }
    
    // === МАРШРУТ ===
    let state = {
        startKey: null,
        startGx: null,
        startGy: null,
        toBldId: null,
        routeDistance: 0
    };
    
    function setQrPoint(qrId) {
        const qr = QR_POINTS.find(q => q.id === qrId);
        if (!qr) return;
        state.startKey = qr.id;
        state.startGx = qr.gx;
        state.startGy = qr.gy;
        clearRoute();
        updateMarkers();
        updateUI();
        setViewToKPP();
    }
    
    function setRoute(bldId) {
        if (!state.startKey) return;
        if (state.toBldId === bldId) { clearRoute(); return; }
        const result = findPath(state.startKey, bldId);
        if (!result) return;
        state.toBldId = bldId;
        state.routeDistance = result.distance;
        currentRouteNodes = result.nodes;
        updateUI();
        drawRoute();
        updateMarkers();
    }
    
    function clearRoute() {
        state.toBldId = null;
        state.routeDistance = 0;
        currentRouteNodes = null;
        updateUI();
        drawRoute();
        updateMarkers();
    }
    
    let currentRouteNodes = null;
    
    function drawRoute() {
        routeCanvas.width = container.clientWidth;
        routeCanvas.height = container.clientHeight;
        ctx.clearRect(0, 0, routeCanvas.width, routeCanvas.height);
        
        if (!currentRouteNodes || !state.startKey) return;
        
        const points = [];
        for (const nodeId of currentRouteNodes) {
            const node = ALL_NODES[nodeId];
            if (node) {
                points.push({ x: node.gx * scale + translateX, y: node.gy * scale + translateY });
            }
        }
        
        if (points.length < 2) return;
        
        ctx.beginPath();
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 1; i < points.length; i++) {
            ctx.lineTo(points[i].x, points[i].y);
        }
        ctx.strokeStyle = '#42A5F5';
        ctx.lineWidth = 5;
        ctx.setLineDash([13, 8]);
        ctx.stroke();
        ctx.setLineDash([]);
        
        const last = points[points.length-1];
        const prev = points[points.length-2];
        if (last && prev) {
            const angle = Math.atan2(last.y - prev.y, last.x - prev.x);
            const arrowSize = 15;
            ctx.beginPath();
            ctx.moveTo(last.x, last.y);
            ctx.lineTo(last.x - arrowSize * Math.cos(angle - 0.45), last.y - arrowSize * Math.sin(angle - 0.45));
            ctx.lineTo(last.x - arrowSize * Math.cos(angle + 0.45), last.y - arrowSize * Math.sin(angle + 0.45));
            ctx.fillStyle = '#1565C0';
            ctx.fill();
        }
    }
    
    // === UI ===
    function updateUI() {
        const routePanel = document.getElementById('routePanel');
        const routeInfo = document.getElementById('routeInfo');
        
        if (state.toBldId !== null) {
            const m = Math.round(state.routeDistance * METERS_PER_PX);
            const fromName = QR_POINTS.find(q => q.id === state.startKey)?.name || 'точки';
            routeInfo.innerHTML = `От <strong>${fromName}</strong> до <strong>Корпуса ${state.toBldId}</strong> <span class="distance-badge">≈ ${m} м</span>`;
            routePanel.classList.remove('hidden');
        } else {
            routePanel.classList.add('hidden');
        }
        updateTableHighlight();
    }
    
    function updateTableHighlight() {
        const rows = document.querySelectorAll('.bld-row');
        rows.forEach(row => {
            const id = parseInt(row.getAttribute('data-bld-id'));
            row.classList.toggle('highlighted', state.toBldId === id);
        });
    }
    
    function initBuildingsTable() {
        const tbody = document.getElementById('buildingsTableBody');
        BUILDINGS.forEach(b => {
            const tr = document.createElement('tr');
            tr.className = 'bld-row';
            tr.setAttribute('data-bld-id', b.id);
            tr.innerHTML = `
                <td class="bld-num"><span class="bld-badge">${b.id}</span></td>
                <td class="bld-name">${b.name}</td>
                <td class="bld-depts">${b.departments}</td>
            `;
            tr.addEventListener('click', () => setRoute(b.id));
            tbody.appendChild(tr);
        });
    }
    
    // === ОБРАБОТЧИКИ ЖЕСТОВ ===
    function getDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx*dx + dy*dy);
    }
    
    container.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            initialDistance = getDistance(e.touches);
            initialScale = scale;
            initialTranslateX = translateX;
            initialTranslateY = translateY;
        } else if (e.touches.length === 1) {
            isPanning = true;
            startPanX = e.touches[0].clientX - translateX;
            startPanY = e.touches[0].clientY - translateY;
        }
    });
    
    container.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
            e.preventDefault();
            const newDistance = getDistance(e.touches);
            scale = initialScale * (newDistance / initialDistance);
            scale = Math.min(Math.max(scale, 0.2), 3);
            
            const rect = container.getBoundingClientRect();
            const centerX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
            const centerY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
            translateX = initialTranslateX - (centerX - rect.width/2) * (scale - initialScale);
            translateY = initialTranslateY - (centerY - rect.height/2) * (scale - initialScale);
            updateTransform();
        } else if (e.touches.length === 1 && isPanning) {
            translateX = e.touches[0].clientX - startPanX;
            translateY = e.touches[0].clientY - startPanY;
            updateTransform();
        }
    });
    
    container.addEventListener('touchend', () => { isPanning = false; });
    
    container.addEventListener('wheel', (e) => {
        e.preventDefault();
        const delta = e.deltaY > 0 ? 0.95 : 1.05;
        const newScale = scale * delta;
        if (newScale > 0.2 && newScale < 3) {
            const rect = container.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;
            const scaleChange = newScale / scale;
            translateX = mouseX - (mouseX - translateX) * scaleChange;
            translateY = mouseY - (mouseY - translateY) * scaleChange;
            scale = newScale;
            updateTransform();
        }
    });
    
    window.addEventListener('resize', () => {
        setViewToKPP();
        updateTransform();
    });
    
    // === ИНИЦИАЛИЗАЦИЯ ===
    function initFromURL() {
        const params = new URLSearchParams(window.location.search);
        const qr = params.get('qr');
        initGraph();
        if (qr === 'qr_gate') {
            setQrPoint('qr_gate');
        } else {
            setQrPoint('qr_gate');
        }
        updateUI();
    }
    
    initBuildingsTable();
    initFromURL();
    
    document.getElementById('btnReset').addEventListener('click', clearRoute);
    
    setViewToKPP();
</script>
</body>
</html>
