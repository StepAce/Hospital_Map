<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0, user-scalable=yes">
    <meta name="theme-color" content="#1565C0">
    <title>Инфекционная больница — навигация</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #1a1a2e;
            font-family: 'Segoe UI', system-ui, sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== ШАПКА ===== */
        .header {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            gap: 10px;
            z-index: 1000;
            min-height: 60px;
        }
        .header-left {
            flex: 1;
            min-width: 0;
        }
        .hospital-name {
            font-size: clamp(18px, 4.5vw, 22px);
            font-weight: 800;
            color: #dc0c0c;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .subtitle {
            font-size: clamp(12px, 3vw, 14px);
            color: #1565C0;
            font-weight: 500;
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .btn-fullscreen {
            background: #E3F2FD;
            color: #1565C0;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            line-height: 1;
        }
        .btn-fullscreen:active { transform: scale(0.93); background: #BBDEFB; }
        .btn-reset-route {
            background: #EF5350;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: clamp(12px, 3vw, 14px);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
            display: none;
            min-height: 40px;
            min-width: 48px;
        }
        .btn-reset-route.show { display: inline-block; }
        .btn-reset-route:active { transform: scale(0.96); }

        /* ===== КАРТА ===== */
        .map-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            min-height: 0;
            background: #1a1a2e;
            touch-action: pan-x !important;
            overscroll-behavior: contain;
        }
        #map {
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            touch-action: pan-x !important;
        }

        /* Leaflet overrides — полное отключение зума и синих полей */
        .leaflet-control-zoom { display: none !important; }
        .leaflet-control-attribution { display: none !important; }
        .leaflet-container {
            background: #1a1a2e !important;
            cursor: ew-resize !important;
            touch-action: pan-x !important;
        }
        .leaflet-grab { cursor: ew-resize !important; }
        .leaflet-dragging .leaflet-grab { cursor: ew-resize !important; }
        .leaflet-tile-pane { opacity: 1; }
        .leaflet-overlay-pane { pointer-events: auto; }
        .leaflet-pane { background: #1a1a2e; }

        /* Кастомные маркеры */
        .building-marker {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: #D7CCC8;
            border: 2px solid #8D6E63;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            color: #5D4037;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
            cursor: pointer;
        }
        .building-marker.selected {
            box-shadow: 0 0 0 5px rgba(21,101,192,0.55);
            border-color: #1565C0;
        }
        .callout-marker {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(21,101,192,0.5);
            border: 1.5px solid rgba(21,101,192,0.75);
            cursor: pointer;
        }
        .start-marker {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2E7D32;
            border: 3px solid white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 0 0 rgba(46,125,50,0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(46,125,50,0.7); }
            70% { box-shadow: 0 0 0 16px rgba(46,125,50,0); }
            100% { box-shadow: 0 0 0 0 rgba(46,125,50,0); }
        }

        /* ===== ПАНЕЛЬ МАРШРУТА (плавающая) ===== */
        .route-panel {
            position: absolute;
            bottom: 12px;
            left: 12px;
            right: 12px;
            background: white;
            border-radius: 14px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            z-index: 1000;
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
            display: none;
            min-height: 48px;
        }
        .route-panel.show { display: flex; }
        .route-info {
            font-size: 15px;
            font-weight: 500;
            color: #263238;
        }
        .distance-badge {
            background: #42A5F5;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 700;
            margin-left: 6px;
        }
        .btn-close-route {
            background: #EF5350;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            min-height: 40px;
            min-width: 48px;
        }
        .btn-close-route:active { transform: scale(0.96); }

        /* ===== ПАНЕЛЬ КОРПУСОВ ===== */
        .buildings-panel {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
            overflow: hidden;
            transition: height 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }
        .buildings-panel:not(.open) { height: 46px; }
        .buildings-panel.open { height: min(55vh, 420px); }

        .panel-header {
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            color: #1a1a2e;
            border-bottom: 1px solid #ccc;
            flex-shrink: 0;
            min-height: 46px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .panel-arrow {
            font-size: 20px;
            transition: transform 0.35s;
        }
        .buildings-panel.open .panel-arrow { transform: rotate(180deg); }

        .buildings-list {
            height: calc(100% - 46px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .building-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            min-height: 52px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .building-item:active { background: #E3F2FD; }
        .building-item.selected { background: #E3F2FD; }
        .building-num {
            width: 34px;
            height: 34px;
            background: #EEEEEE;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 16px;
            color: #37474F;
            flex-shrink: 0;
        }
        .building-info { flex: 1; min-width: 0; }
        .building-name {
            font-weight: 600;
            font-size: 16px;
            color: #263238;
        }
        .building-depts {
            font-size: 12px;
            color: #90A4AE;
        }

        /* ===== ПАНЕЛЬ ПОДСКАЗКИ ===== */
        .hint-panel {
            background: #F8F9FA;
            flex-shrink: 0;
            z-index: 1000;
        }
        .hint-text {
            padding: 8px 20px;
            font-size: 13px;
            color: #546E7A;
            display: flex;
            align-items: center;
            gap: 6px;
            min-height: 38px;
        }
        .hint-text .emoji {
            display: inline-block;
            animation: bounce 1.3s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(5px); }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="header-left">
        <div class="hospital-name">Инфекционная больница</div>
        <div class="subtitle">Навигационная карта</div>
    </div>
    <div class="header-actions">
        <button class="btn-fullscreen" id="btnFullscreen" title="На весь экран" aria-label="На весь экран">⛶</button>
        <button class="btn-reset-route" id="btnResetRoute">✕ Сбросить</button>
    </div>
</div>

<div class="map-container" id="mapContainer">
    <div id="map"></div>
    <div class="route-panel" id="routePanel">
        <span class="route-info" id="routeInfo"></span>
        <button class="btn-close-route" id="btnCloseRoute">✕</button>
    </div>
</div>

<div class="buildings-panel" id="buildingsPanel">
    <div class="panel-header" id="panelHeader">
        <span>📋 Корпуса и отделения</span>
        <span class="panel-arrow" id="panelArrow">▲</span>
    </div>
    <div class="buildings-list" id="buildingsList"></div>
</div>

<div class="hint-panel">
    <div class="hint-text">
            <span class="emoji">👆</span> Нажми на корпус, чтобы построить маршрут
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
    'use strict';

    // === СОСТОЯНИЕ ===
    let appData = null;
    let map = null;
    let allNodes = {};
    let graph = {};
    let startKey = 'qr_gate';
    let selectedBuildingId = null;
    let currentRouteLine = null;
    let buildingMarkers = {};
    let startMarker = null;
    let calloutMarkers = [];
    let metersPerPixel = 0.25;

    // === ЗАГРУЗКА ДАННЫХ ===
    async function loadData() {
        const resp = await fetch('data.json');
        if (!resp.ok) throw new Error('Не удалось загрузить data.json');
        appData = await resp.json();
        metersPerPixel = appData.config.metersPerPixel;
    }

    // === ПОСТРОЕНИЕ ГРАФА ===
    function buildGraph() {
        allNodes = {};
        graph = {};

        appData.buildings.forEach(function(b) {
            var key = 'B' + b.id;
            allNodes[key] = { x: b.x, y: b.y, name: b.name, isBuilding: true, buildingId: b.id };
            graph[key] = {};
        });
        appData.waypoints.forEach(function(w) {
            allNodes[w.id] = { x: w.x, y: w.y, isWaypoint: true };
            graph[w.id] = {};
        });
        appData.startPoints.forEach(function(s) {
            allNodes[s.id] = { x: s.x, y: s.y, name: s.name, isStart: true };
            graph[s.id] = {};
        });

        appData.graph.edges.forEach(function(e) {
            var a = e[0], b = e[1];
            if (!allNodes[a] || !allNodes[b]) return;
            var dx = allNodes[a].x - allNodes[b].x;
            var dy = allNodes[a].y - allNodes[b].y;
            var dist = Math.hypot(dx, dy);
            graph[a][b] = dist;
            graph[b][a] = dist;
        });
    }

    // === АЛГОРИТМ ДЕЙКСТРЫ ===
    function findPath(fromKey, toKey) {
        if (!allNodes[fromKey] || !allNodes[toKey]) return null;
        var dist = {}, prev = {};
        Object.keys(allNodes).forEach(function(k) { dist[k] = Infinity; });
        dist[fromKey] = 0;
        var unvisited = Object.keys(allNodes).slice();
        while (unvisited.length) {
            var minIdx = 0;
            for (var i = 1; i < unvisited.length; i++) {
                if (dist[unvisited[i]] < dist[unvisited[minIdx]]) minIdx = i;
            }
            var current = unvisited[minIdx];
            unvisited.splice(minIdx, 1);
            if (dist[current] === Infinity || current === toKey) break;
            var neighbors = graph[current];
            if (neighbors) {
                Object.keys(neighbors).forEach(function(nb) {
                    var alt = dist[current] + neighbors[nb];
                    if (alt < dist[nb]) { dist[nb] = alt; prev[nb] = current; }
                });
            }
        }
        if (dist[toKey] === Infinity) return null;
        var path = [toKey];
        var cur = toKey;
        while (cur !== fromKey) { cur = prev[cur]; path.unshift(cur); }
        return { nodes: path, distance: dist[toKey] };
    }

    // === ИНИЦИАЛИЗАЦИЯ КАРТЫ LEAFLET ===
    function initMap() {
        var cfg = appData.config;

        var mapEl = document.getElementById('map');
        if (!mapEl) {
            throw new Error('Элемент #map не найден в DOM');
        }

        var mapContainer = document.getElementById('mapContainer');
        if (!mapContainer) {
            throw new Error('Элемент #mapContainer не найден в DOM');
        }

        var containerHeight = mapContainer.clientHeight;
        if (!containerHeight || containerHeight <= 0) {
            containerHeight = window.innerHeight * 0.5;
        }

        // Зум под высоту контейнера: всё изображение видно по вертикали
        var zoomForHeight = Math.log2(containerHeight / cfg.mapHeight);

        map = L.map('map', {
            crs: L.CRS.Simple,
            center: [cfg.mapHeight / 2, cfg.mapWidth / 2],
            zoom: zoomForHeight,
            minZoom: zoomForHeight,
            maxZoom: zoomForHeight,
            zoomControl: false,
            scrollWheelZoom: false,
            doubleClickZoom: false,
            boxZoom: false,
            keyboard: false,
            touchZoom: false,
            attributionControl: false,
            dragging: true,
            bounceAtZoomLimits: false,
            inertia: true,
            inertiaDeceleration: 2000,
            worldCopyJump: false
        });

        var bounds = [[0, 0], [cfg.mapHeight, cfg.mapWidth]];
        L.imageOverlay(cfg.mapImage, bounds).addTo(map);

        // maxBounds по высоте совпадает с изображением → вертикальный pan заблокирован
        // по ширине — позволяет горизонтальную прокрутку в пределах изображения
        map.setMaxBounds(bounds);

        // Жёсткая блокировка вертикального pan: сбрасываем Y на центр при любом смещении
        var centerY = cfg.mapHeight / 2;
        map.on('move', function() {
            var curCenter = map.getCenter();
            if (Math.abs(curCenter.lat - centerY) > 0.5) {
                map.panTo([centerY, curCenter.lng], { animate: false });
            }
        });
    }

    // === СОЗДАНИЕ ИКОНОК МАРКЕРОВ ===
    function createBuildingIcon(buildingId, selected) {
        var cls = 'building-marker';
        if (selected) cls += ' selected';
        return L.divIcon({
            className: '',
            html: '<div class="' + cls + '">' + buildingId + '</div>',
            iconSize: [36, 36],
            iconAnchor: [18, 18]
        });
    }

    function createCalloutIcon() {
        return L.divIcon({
            className: '',
            html: '<div class="callout-marker"></div>',
            iconSize: [14, 14],
            iconAnchor: [7, 7]
        });
    }

    function createStartIcon() {
        return L.divIcon({
            className: '',
            html: '<div class="start-marker">📍</div>',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });
    }

    // === ОТРИСОВКА МАРКЕРОВ ===
    function renderMarkers() {
        appData.buildings.forEach(function(b) {
            var latlng = [b.y, b.x];
            var icon = createBuildingIcon(b.id, selectedBuildingId === b.id);
            var marker = L.marker(latlng, { icon: icon, interactive: true }).addTo(map);
            marker.on('click', function() { setRoute(b.id); });
            buildingMarkers[b.id] = marker;

            if (b.callout) {
                var clatlng = [b.callout.y, b.callout.x];
                var cmarker = L.marker(clatlng, { icon: createCalloutIcon(), interactive: true }).addTo(map);
                cmarker.on('click', function() { setRoute(b.id); });
                calloutMarkers.push(cmarker);
            }
        });

        appData.startPoints.forEach(function(sp) {
            if (sp.id === startKey) {
                var latlng = [sp.y, sp.x];
                startMarker = L.marker(latlng, { icon: createStartIcon(), interactive: false }).addTo(map);
            }
        });
    }

    // === ПОСТРОЕНИЕ МАРШРУТА ===
    function setRoute(buildingId) {
        if (!map) return;
        if (selectedBuildingId === buildingId) { clearRoute(); return; }

        var toKey = 'B' + buildingId;
        var result = findPath(startKey, toKey);
        if (!result) return;

        // Удаляем старый маршрут
        clearRoutePolyline();

        // Строим новый
        var latlngs = result.nodes.map(function(nodeId) {
            var n = allNodes[nodeId];
            return [n.y, n.x];
        });

        currentRouteLine = L.polyline(latlngs, {
            color: '#42A5F5',
            weight: 5,
            dashArray: '10, 8',
            lineJoin: 'round',
            lineCap: 'round'
        }).addTo(map);

        selectedBuildingId = buildingId;
        updateBuildingMarkerIcons();
        updateRoutePanel(buildingId, result.distance);
        updateBuildingsListSelection();

        // Панорамирование к маршруту (зум зафиксирован)
        map.fitBounds(currentRouteLine.getBounds().pad(0.3), { animate: true, duration: 0.6 });
    }

    function clearRoutePolyline() {
        if (currentRouteLine && map) {
            map.removeLayer(currentRouteLine);
            currentRouteLine = null;
        }
    }

    function clearRoute() {
        clearRoutePolyline();
        selectedBuildingId = null;
        updateBuildingMarkerIcons();
        updateRoutePanel(null, 0);
        updateBuildingsListSelection();
        if (map && appData) {
            var bounds = [[0, 0], [appData.config.mapHeight, appData.config.mapWidth]];
            map.fitBounds(bounds, { animate: true, duration: 0.5 });
        }
    }

    function updateBuildingMarkerIcons() {
        if (!map) return;
        Object.keys(buildingMarkers).forEach(function(bid) {
            var bId = parseInt(bid);
            var marker = buildingMarkers[bid];
            if (marker) marker.setIcon(createBuildingIcon(bId, selectedBuildingId === bId));
        });
    }

    // === ПАНЕЛЬ ИНФОРМАЦИИ О МАРШРУТЕ ===
    function updateRoutePanel(buildingId, distance) {
        var panel = document.getElementById('routePanel');
        var info = document.getElementById('routeInfo');
        var resetBtn = document.getElementById('btnResetRoute');

        if (buildingId) {
            var meters = Math.round(distance * metersPerPixel);
            var building = appData.buildings.find(function(b) { return b.id === buildingId; });
            var name = building ? building.name : ('Корпус ' + buildingId);
            info.innerHTML = '🚶 ' + name + ' <span class="distance-badge">≈ ' + meters + ' м</span>';
            panel.classList.add('show');
            resetBtn.classList.add('show');
        } else {
            panel.classList.remove('show');
            resetBtn.classList.remove('show');
        }
    }

    // === ПАНЕЛЬ СПИСКА КОРПУСОВ ===
    function renderBuildingsList() {
        var list = document.getElementById('buildingsList');
        list.innerHTML = '';
        appData.buildings.forEach(function(b) {
            var div = document.createElement('div');
            div.className = 'building-item';
            div.setAttribute('data-building-id', b.id);
            div.innerHTML =
                '<div class="building-num">' + b.id + '</div>' +
                '<div class="building-info">' +
                    '<div class="building-name">' + escHtml(b.name) + '</div>' +
                    '<div class="building-depts">' + escHtml(b.departments) + '</div>' +
                '</div>';
            div.addEventListener('click', function() { setRoute(b.id); });
            list.appendChild(div);
        });
    }

    function updateBuildingsListSelection() {
        var items = document.querySelectorAll('.building-item');
        items.forEach(function(item) {
            var bid = parseInt(item.getAttribute('data-building-id'));
            if (bid === selectedBuildingId) item.classList.add('selected');
            else item.classList.remove('selected');
        });
    }

    function escHtml(str) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(str));
        return div.innerHTML;
    }

    // === ПАНЕЛЬ КОРПУСОВ: СВОРАЧИВАНИЕ/РАЗВОРАЧИВАНИЕ ===
    function setupPanelToggle() {
        var panel = document.getElementById('buildingsPanel');
        var header = document.getElementById('panelHeader');
        header.addEventListener('click', function() {
            panel.classList.toggle('open');
        });
        panel.addEventListener('transitionend', function(e) {
            if (e.propertyName === 'height' && e.target === panel) {
                if (map) map.invalidateSize();
            }
        });
    }

    // === ОБРАБОТКА QR-ПАРАМЕТРА ===
    function handleQRParam() {
        var params = new URLSearchParams(window.location.search);
        var qrVal = params.get('qr');
        if (qrVal) {
            var sp = appData.startPoints.find(function(p) { return p.id === qrVal; });
            if (sp) {
                startKey = sp.id;
            }
        }
    }

    // === АДАПТАЦИЯ ПРИ ИЗМЕНЕНИИ РАЗМЕРА ОКНА ===
    function setupResizeHandler() {
        function onResize() {
            if (map) map.invalidateSize();
        }
        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', function() { setTimeout(onResize, 50); });
        }
        window.addEventListener('resize', function() { setTimeout(onResize, 50); });
    }

    // === FULLSCREEN ===
    function setupFullscreen() {
        var btn = document.getElementById('btnFullscreen');
        btn.addEventListener('click', function() {
            if (document.fullscreenElement) {
                document.exitFullscreen();
            } else {
                document.documentElement.requestFullscreen();
            }
        });
        document.addEventListener('fullscreenchange', function() {
            if (map) setTimeout(function() { map.invalidateSize(); }, 100);
        });
    }

    // === ЗАПУСК ===
    async function main() {
        await loadData();
        buildGraph();
        initMap();
        handleQRParam();
        renderMarkers();
        renderBuildingsList();
        setupPanelToggle();
        setupResizeHandler();
        setupFullscreen();

        document.getElementById('btnResetRoute').addEventListener('click', clearRoute);
        document.getElementById('btnCloseRoute').addEventListener('click', clearRoute);
    }

    main().catch(function(err) {
        document.getElementById('map').innerHTML =
            '<div style="color:#fff;padding:40px;text-align:center;font-size:16px;">' +
            'Ошибка загрузки: ' + escHtml(err.message) + '</div>';
    });

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
            .then(function(reg) { console.log('SW registered:', reg.scope); })
            .catch(function(err) { console.warn('SW registration failed:', err); });
    }
})();
</script>
</body>
</html>
