<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Карта территории больницы</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root {
    --green: #2E7D32;
    --green-light: #4CAF50;
    --blue: #1565C0;
    --blue-light: #42A5F5;
    --white: #FFFFFF;
    --dark: #263238;
    --shadow: 0 2px 12px rgba(0,0,0,0.12);
    --red: #E53935;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: #1a1a2e;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  }

  .app {
    height: 100%;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 20;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 0 0 14px 14px;
    padding: 8px 16px;
    box-shadow: 0 2px 16px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 6px;
  }

  header h1 {
    font-size: clamp(17px, 3.5vw, 22px);
    font-weight: 700;
    color: var(--dark);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  header h1 .icon {
    width: 32px; height: 32px;
    background: var(--green);
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 18px;
    flex-shrink: 0;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    font-weight: 500;
    color: #546E7A;
  }

  .legend-dot {
    width: 13px; height: 13px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .legend-dot.green { background: var(--green); }
  .legend-dot.blue { background: var(--blue); }
  .legend-dot.orange { background: #D7CCC8; border: 1.5px solid #8D6E63; }

  .main-content {
    flex: 1;
    display: flex;
    min-height: 0;
    position: relative;
  }

  .map-column {
    flex: 1;
    min-width: 0;
    min-height: 0;
    position: relative;
  }

  .map-wrapper {
    position: absolute;
    inset: 0;
    background: #1a1a2e;
    overflow: hidden;
  }

  #map {
    width: 100%;
    height: 100%;
    background: #1a1a2e;
  }

  .sidebar {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    z-index: 15;
    width: 290px;
    background: rgba(255,255,255,0.96);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: -2px 0 16px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    max-height: none;
  }

  .sidebar-header {
    padding: 10px 15px;
    font-size: 14px;
    font-weight: 700;
    color: var(--dark);
    border-bottom: 1px solid #E0E0E0;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .sidebar-table-wrapper {
    overflow-y: auto;
    flex: 1;
  }

  .bld-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .bld-row {
    cursor: pointer;
    transition: background 0.15s;
    border-bottom: 1px solid #F5F5F5;
  }
  .bld-row:last-child { border-bottom: none; }
  .bld-row:hover { background: #F5F5F5; }

  .bld-row.highlighted {
    background: #E3F2FD;
  }
  .bld-row.highlighted .bld-badge {
    background: var(--blue);
    color: #FFFFFF;
  }

  .bld-num {
    width: 38px;
    text-align: center;
    padding: 8px 4px;
    vertical-align: top;
  }

  .bld-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: #EEEEEE;
    color: #757575;
    font-weight: 700;
    font-size: 13px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .bld-name {
    font-weight: 600;
    color: var(--dark);
    padding: 8px 2px;
    white-space: nowrap;
  }

  .bld-depts {
    color: #90A4AE;
    font-size: 11px;
    padding: 8px 10px 8px 2px;
    line-height: 1.45;
  }

  .leaflet-container {
    background: #1a1a2e;
  }

  .bld-marker-inner {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: #D7CCC8;
    border: 2px solid #8D6E63;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #5D4037;
    box-shadow: 2px 2px 6px rgba(0,0,0,0.20);
    font-family: 'Segoe UI', system-ui, sans-serif;
  }

  .bld-marker-inner.target {
    box-shadow: 0 0 0 4px rgba(21,101,192,0.55);
    border-color: #1565C0;
  }

  .start-marker-inner {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: #2E7D32;
    border: 3px solid #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    box-shadow: 0 0 14px rgba(46,125,50,0.45);
    animation: startPulse 1.5s ease-in-out infinite;
  }

  @keyframes startPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(46,125,50,0.35); }
    50% { box-shadow: 0 0 22px rgba(46,125,50,0.70); }
  }

  .route-panel {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    background: var(--white);
    border-radius: 14px;
    padding: 13px 18px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    animation: slideUp 0.3s ease-out;
    z-index: 13;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .route-info {
    font-size: 14px;
    font-weight: 500;
    color: var(--dark);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .route-info .distance-badge {
    background: var(--blue-light);
    color: white;
    padding: 4px 11px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 17px;
  }

  .qr-info {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    background: var(--white);
    border-radius: 14px;
    padding: 11px 18px;
    box-shadow: var(--shadow);
    font-size: 14px;
    font-weight: 500;
    color: var(--dark);
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    z-index: 12;
  }

  .qr-info .pin-icon { font-size: 18px; }

  .no-qr-info {
    position: absolute;
    top: 54px;
    left: 12px;
    right: 12px;
    background: #FFF3E0;
    border: 1.5px solid #FFB74D;
    border-radius: 14px;
    padding: 14px 18px;
    box-shadow: var(--shadow);
    font-size: 14px;
    font-weight: 500;
    color: #E65100;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    line-height: 1.5;
    z-index: 12;
  }

  .no-qr-info .warn-icon { font-size: 22px; flex-shrink: 0; line-height: 1; }

  .test-banner {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    background: rgba(66,66,66,0.88);
    color: #E0E0E0;
    border-radius: 12px;
    padding: 9px 14px;
    font-size: 13px;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 10px;
    box-shadow: var(--shadow);
    z-index: 12;
  }

  .test-banner .test-icon { font-size: 18px; flex-shrink: 0; }
  .test-banner .test-text { flex: 1; min-width: 0; line-height: 1.4; }
  .test-banner .test-close {
    background: none; border: none; color: #BDBDBD; font-size: 18px;
    cursor: pointer; padding: 2px 6px; border-radius: 6px;
    flex-shrink: 0; line-height: 1; box-shadow: none; transition: color 0.15s;
  }
  .test-banner .test-close:hover { color: #FFFFFF; background: rgba(255,255,255,0.1); }

  .controls {
    position: absolute;
    bottom: 12px;
    left: 0;
    right: 0;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 12;
    pointer-events: none;
  }
  .controls button { pointer-events: auto; }

  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 20px;
    border: none;
    border-radius: 11px;
    cursor: pointer;
    transition: all 0.18s;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--shadow);
    white-space: nowrap;
  }
  button:active { transform: scale(0.96); }

  .btn-select { background: var(--green); color: white; }
  .btn-select:hover { background: #1B5E20; }

  .btn-select-map { background: #5C6BC0; color: white; }
  .btn-select-map:hover { background: #3949AB; }

  .btn-reset { background: #EF5350; color: white; }
  .btn-reset:hover { background: #C62828; }

  .btn-sm {
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border: none;
    border-radius: 9px;
    cursor: pointer;
    background: #ECEFF1;
    color: #37474F;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10);
    white-space: nowrap;
  }
  .btn-sm:active { transform: scale(0.95); }

  .hidden { display: none !important; }

  @media (max-width: 768px) {
    .sidebar {
      top: auto;
      bottom: 0;
      left: 0;
      right: 0;
      width: 100%;
      max-height: 40vh;
      border-radius: 16px 16px 0 0;
    }
    .bld-table { font-size: 13px; }
    .bld-name { font-size: 13px; }
    .bld-depts { font-size: 11px; }
  }

  @media (max-width: 600px) {
    header { padding: 6px 10px; border-radius: 0 0 10px 10px; }
    header h1 { font-size: 14px; }
    header h1 .icon { width: 24px; height: 24px; font-size: 14px; border-radius: 6px; }
    button { font-size: 14px; padding: 10px 16px; border-radius: 10px; }
    .route-panel { padding: 10px 13px; border-radius: 12px; flex-direction: column; align-items: flex-start; left: 6px; right: 6px; bottom: 6px; }
    .route-info { font-size: 14px; }
    .route-info .distance-badge { font-size: 16px; }
    .qr-info { padding: 9px 14px; font-size: 14px; border-radius: 12px; left: 6px; right: 6px; bottom: 6px; }
    .no-qr-info { padding: 10px 14px; font-size: 14px; border-radius: 12px; top: 48px; left: 6px; right: 6px; }
    .test-banner { font-size: 13px; padding: 8px 10px; left: 6px; right: 6px; bottom: 6px; }
    .test-banner .test-icon { font-size: 16px; }
    .sidebar-header { font-size: 14px; }
    .bld-table { font-size: 13px; }
    .bld-name { font-size: 13px; }
    .bld-depts { font-size: 11px; }
    .bld-badge { width: 28px; height: 28px; font-size: 14px; }
    .legend { gap: 8px; }
    .legend-item { font-size: 11px; }
    .controls { bottom: 6px; }
    .bld-marker-inner { width: 28px; height: 28px; font-size: 14px; border-radius: 7px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span class="icon">+</span>Навигация по больнице</h1>
    <div class="legend">
      <span class="legend-item"><span class="legend-dot green"></span> Я здесь</span>
      <span class="legend-item"><span class="legend-dot blue"></span> Корпус-цель</span>
      <span class="legend-item"><span class="legend-dot orange"></span> Корпуса</span>
    </div>
  </header>

  <div class="main-content">
    <div class="map-column">
      <div class="map-wrapper" id="mapWrapper">
        <div id="map"></div>

        <div class="qr-info hidden" id="qrInfo">
          <span class="pin-icon">📍</span> Вы у: <strong id="qrInfoName"></strong>
        </div>

        <div class="no-qr-info hidden" id="noQrInfo">
          <span class="warn-icon">⚠</span>
          <span>QR-код не распознан.<br>Пожалуйста, отсканируйте QR-код у входа в больницу.</span>
        </div>

        <div class="test-banner hidden" id="testBanner">
          <span class="test-icon">🧪</span>
          <span class="test-text">Тестовый режим: точка у КПП. Для реального использования отсканируйте QR-код.</span>
          <button class="test-close" id="testBannerClose">✕</button>
        </div>

        <div class="controls" id="controls">
          <button class="btn-sm" id="btnZoomReset">↺ Сбросить зум</button>
        </div>

        <div class="route-panel hidden" id="routePanel">
          <span class="route-info" id="routeInfo"></span>
          <button class="btn-reset" id="btnReset">✕ Сбросить маршрут</button>
        </div>
      </div>
    </div>

    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">📋 Корпуса больницы</div>
      <div class="sidebar-table-wrapper">
        <table class="bld-table">
          <tbody id="buildingsTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  var IMG_W = 2016, IMG_H = 864;
  var METERS_PER_PX = 0.25;

  function toLatLng(gx, gy) {
    return [gy, gx];
  }

  var BUILDINGS = [
    { id: 1, gx: 1220, gy: 370, hw: 30, hd: 30 },
  ];

  var BUILDING_INFO = [
    { id: 1, name: 'Главный корпус', departments: '—' },
  ];

  var CALLOUTS = [
    { id: 1, gx: 1218, gy: 205, text: 'Главный корпус', buildingId: 1 },
  ];

  var QR_POINTS = [
    { id: 'qr_gate', name: 'КПП', gx: 1301, gy: 684 },
  ];

  var WAYPOINTS = [
    { id: 'W0', gx: 1314, gy: 689 },
    { id: 'W1', gx: 1402, gy: 659 },
    { id: 'W2', gx: 1491, gy: 580 },
    { id: 'W3', gx: 1401, gy: 482 },
    { id: 'W4', gx: 1314, gy: 404 },
  ];

  var ALL_NODES = {};
  var GRAPH = {};

  function addNode(key, obj) {
    ALL_NODES[key] = obj;
    GRAPH[key] = GRAPH[key] || {};
  }

  function addEdge(a, b) {
    GRAPH[a] = GRAPH[a] || {};
    GRAPH[b] = GRAPH[b] || {};
    var d = distGrid(ALL_NODES[a], ALL_NODES[b]);
    GRAPH[a][b] = d;
    GRAPH[b][a] = d;
  }

  function removeNode(key) {
    delete ALL_NODES[key];
    delete GRAPH[key];
    var nkeys = Object.keys(GRAPH);
    for (var i = 0; i < nkeys.length; i++) {
      delete GRAPH[nkeys[i]][key];
    }
  }

  function distGrid(a, b) {
    var dx = a.gx - b.gx;
    var dy = a.gy - b.gy;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function distGridPoint(gx1, gy1, gx2, gy2) {
    var dx = gx1 - gx2;
    var dy = gy1 - gy2;
    return Math.sqrt(dx * dx + dy * dy);
  }

  function initGraph() {
    ALL_NODES = {};
    GRAPH = {};
    BUILDINGS.forEach(function(b)  { addNode('B' + b.id, b); });
    WAYPOINTS.forEach(function(w)  { addNode(w.id, w); });
    QR_POINTS.forEach(function(q)  { addNode(q.id, q); });

    var edges = [
      ['W0','W1'], ['W1','W2'], ['W2','W3'], ['W3','W4'],
      ['B1','W4'],
      ['qr_gate','W0'],
    ];
    edges.forEach(function(e) { addEdge(e[0], e[1]); });
  }

  function findPath(startKey, toBldId) {
    var toKey = 'B' + toBldId;
    var distMap = {};
    var prev = {};
    var allKeys = Object.keys(ALL_NODES);
    for (var i = 0; i < allKeys.length; i++) {
      distMap[allKeys[i]] = Infinity;
    }
    distMap[startKey] = 0;

    var unvisited = allKeys.slice();
    while (unvisited.length > 0) {
      var minIdx = 0;
      for (var i = 1; i < unvisited.length; i++) {
        if (distMap[unvisited[i]] < distMap[unvisited[minIdx]]) minIdx = i;
      }
      var current = unvisited[minIdx];
      unvisited.splice(minIdx, 1);
      if (distMap[current] === Infinity) break;
      if (current === toKey) break;
      var neighbors = GRAPH[current];
      if (!neighbors) continue;
      var nkeys = Object.keys(neighbors);
      for (var j = 0; j < nkeys.length; j++) {
        var nb = nkeys[j];
        var alt = distMap[current] + neighbors[nb];
        if (alt < distMap[nb]) {
          distMap[nb] = alt;
          prev[nb] = current;
        }
      }
    }
    if (distMap[toKey] === Infinity) return null;
    var path = [toKey];
    var cur = toKey;
    while (cur !== startKey) {
      cur = prev[cur];
      if (!cur) return null;
      path.unshift(cur);
    }
    return { nodes: path, distance: distMap[toKey] };
  }

  function pathToLatLngs(path) {
    return path.nodes.map(function(k) {
      var n = ALL_NODES[k];
      return toLatLng(n.gx, n.gy);
    });
  }

  var map = L.map('map', {
    crs: L.CRS.Simple,
    minZoom: 1,
    maxZoom: 5,
    zoomControl: false,
    attributionControl: false,
  });

  var imageBounds = [[0, 0], [IMG_H, IMG_W]];
  L.imageOverlay('hospital-map.png', imageBounds).addTo(map);

  map.fitBounds(imageBounds);

  var INIT_CENTER = toLatLng(1301, 684);
  var INIT_ZOOM = 3;

  var state = {
    activeQrId: null,
    activeQrName: null,
    startGx: null,
    startGy: null,
    startKey: null,
    toBldId: null,
    routeDistance: 0,
  };

  var isDebug = false;
  var isTestMode = false;

  var startMarker = null;
  var buildingMarkers = {};
  var calloutMarkers = {};
  var routeLine = null;

  function hasStart() { return state.startKey !== null; }

  function createBuildingIcon(bldId, isTarget) {
    return L.divIcon({
      className: 'bld-marker-icon',
      html: '<div class="bld-marker-inner' + (isTarget ? ' target' : '') + '">' + bldId + '</div>',
      iconSize: [34, 34],
      iconAnchor: [17, 17],
    });
  }

  function createStartIcon() {
    return L.divIcon({
      className: 'start-marker-icon',
      html: '<div class="start-marker-inner">📍</div>',
      iconSize: [30, 30],
      iconAnchor: [15, 15],
    });
  }

  function createCalloutIcon() {
    return L.divIcon({
      className: 'callout-marker-icon',
      html: '<div style="width:12px;height:12px;border-radius:50%;background:rgba(21,101,192,0.45);border:1.5px solid rgba(21,101,192,0.7);"></div>',
      iconSize: [12, 12],
      iconAnchor: [6, 6],
    });
  }

  function refreshBuildingMarkers() {
    Object.keys(buildingMarkers).forEach(function(k) {
      map.removeLayer(buildingMarkers[k]);
    });
    buildingMarkers = {};

    BUILDINGS.forEach(function(b) {
      var isTarget = state.toBldId === b.id;
      var icon = createBuildingIcon(b.id, isTarget);
      var marker = L.marker(toLatLng(b.gx, b.gy), { icon: icon }).addTo(map);
      marker.on('click', function() {
        if (hasStart()) setRoute(b.id);
      });
      buildingMarkers['B' + b.id] = marker;
    });
  }

  function refreshCalloutMarkers() {
    Object.keys(calloutMarkers).forEach(function(k) {
      map.removeLayer(calloutMarkers[k]);
    });
    calloutMarkers = {};

    CALLOUTS.forEach(function(c) {
      var marker = L.marker(toLatLng(c.gx, c.gy), {
        icon: createCalloutIcon(),
        interactive: true,
      }).addTo(map);
      marker.on('click', function() {
        if (hasStart()) setRoute(c.buildingId);
      });
      calloutMarkers['C' + c.id] = marker;
    });
  }

  function refreshStartMarker() {
    if (startMarker) { map.removeLayer(startMarker); startMarker = null; }
    if (!hasStart()) return;
    var icon = createStartIcon();
    startMarker = L.marker(toLatLng(state.startGx, state.startGy), {
      icon: icon,
      zIndexOffset: 1000,
    }).addTo(map);
  }

  function drawRouteLine() {
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    if (!state.toBldId || !hasStart()) return;
    var result = findPath(state.startKey, state.toBldId);
    if (!result) return;
    state.routeDistance = result.distance;
    var latlngs = pathToLatLngs(result);
    routeLine = L.polyline(latlngs, {
      color: '#42A5F5',
      weight: 5,
      opacity: 0.85,
      dashArray: '13 8',
      lineCap: 'round',
      lineJoin: 'round',
    }).addTo(map);
  }

  function setQrPoint(qrId) {
    var qr = QR_POINTS.find(function(q) { return q.id === qrId; });
    if (!qr) return;
    state.activeQrId = qr.id;
    state.activeQrName = qr.name;
    state.startGx = qr.gx;
    state.startGy = qr.gy;
    state.startKey = qr.id;
    clearRoute();
    refreshStartMarker();
    refreshBuildingMarkers();
    map.setView(INIT_CENTER, INIT_ZOOM, { animate: true, duration: 0.6 });
    updateUI();
  }

  function setRoute(toBldId) {
    if (!hasStart()) return;
    if (state.toBldId === toBldId) { clearRoute(); return; }
    var result = findPath(state.startKey, toBldId);
    if (!result) return;
    state.toBldId = toBldId;
    state.routeDistance = result.distance;
    refreshBuildingMarkers();
    drawRouteLine();
    updateUI();
  }

  function clearRoute() {
    state.toBldId = null;
    state.routeDistance = 0;
    if (routeLine) { map.removeLayer(routeLine); routeLine = null; }
    refreshBuildingMarkers();
    updateUI();
  }

  function updateUI() {
    var routePanel = document.getElementById('routePanel');
    var routeInfo  = document.getElementById('routeInfo');
    var qrInfo     = document.getElementById('qrInfo');
    var qrInfoName = document.getElementById('qrInfoName');
    var noQrInfo   = document.getElementById('noQrInfo');
    var testBanner = document.getElementById('testBanner');

    if (state.toBldId !== null) {
      var m = Math.round(state.routeDistance * METERS_PER_PX);
      var fromName = state.activeQrName || 'точки';
      routeInfo.innerHTML =
        'От <strong>' + fromName + '</strong> до <strong>Корпуса ' + state.toBldId +
        '</strong> <span class="distance-badge">≈ ' + m + ' м</span>';
      routePanel.classList.remove('hidden');
    } else {
      routePanel.classList.add('hidden');
    }

    if (hasStart()) {
      qrInfoName.textContent = state.activeQrName;
      qrInfo.classList.remove('hidden');
      noQrInfo.classList.add('hidden');
    } else {
      qrInfo.classList.add('hidden');
      if (isDebug) {
        noQrInfo.classList.add('hidden');
      } else {
        noQrInfo.classList.remove('hidden');
      }
    }

    testBanner.classList.toggle('hidden', !isTestMode);

    updateTableHighlight();
  }

  function updateTableHighlight() {
    var rows = document.querySelectorAll('.bld-row');
    for (var i = 0; i < rows.length; i++) {
      var rowId = parseInt(rows[i].getAttribute('data-bld-id'), 10);
      rows[i].classList.toggle('highlighted', rowId === state.toBldId);
    }
  }

  function handleTableRowClick(bldId) {
    if (state.toBldId === bldId) {
      clearRoute();
      return;
    }
    if (hasStart()) {
      setRoute(bldId);
    } else {
      state.toBldId = bldId;
      refreshBuildingMarkers();
      updateUI();
    }
  }

  function initBuildingsTable() {
    var tbody = document.getElementById('buildingsTableBody');
    BUILDING_INFO.forEach(function(info) {
      var tr = document.createElement('tr');
      tr.className = 'bld-row';
      tr.setAttribute('data-bld-id', info.id);
      tr.innerHTML =
        '<td class="bld-num"><span class="bld-badge">' + info.id + '</span></td>' +
        '<td class="bld-name">' + info.name + '</td>' +
        '<td class="bld-depts">' + info.departments + '</td>';
      tr.addEventListener('click', function() {
        handleTableRowClick(info.id);
      });
      tbody.appendChild(tr);
    });
  }

  document.getElementById('btnZoomReset').addEventListener('click', function() {
    map.setView(hasStart() ? INIT_CENTER : [IMG_H / 2, IMG_W / 2], hasStart() ? INIT_ZOOM : 1, { animate: true, duration: 0.5 });
  });

  document.getElementById('btnReset').addEventListener('click', function() {
    clearRoute();
  });

  document.getElementById('testBannerClose').addEventListener('click', function() {
    isTestMode = false;
    document.getElementById('testBanner').classList.add('hidden');
  });

  function initFromURL() {
    try {
      var params = new URLSearchParams(window.location.search);
      var qrParam = params.get('qr');
      isDebug = params.get('debug') === 'true';

      if (qrParam) {
        var valid = ['qr_gate'];
        if (valid.indexOf(qrParam) !== -1) {
          isTestMode = false;
          initGraph();
          refreshCalloutMarkers();
          setQrPoint(qrParam);
          return;
        }
        isTestMode = false;
        initGraph();
        refreshCalloutMarkers();
        updateUI();
        return;
      }

      if (isDebug) {
        isTestMode = false;
        initGraph();
        refreshCalloutMarkers();
        updateUI();
        return;
      }

      isTestMode = true;
      initGraph();
      refreshCalloutMarkers();
      setQrPoint('qr_gate');
      return;
    } catch (e) {}
    isTestMode = true;
    initGraph();
    refreshCalloutMarkers();
    setQrPoint('qr_gate');
  }

  window.addEventListener('resize', function() {
    map.invalidateSize();
  });

  initFromURL();
  initBuildingsTable();
})();
</script>
</body>
</html>
